<style>
  /* ================= 与「会动网页」统一的工作台 7 套皮肤与设计体系 ================= */
  :root {
    --site-nav-h: 60px;
    --wb-bar-h: 53px;
    --bg: #f4f5f7;
    --card: #ffffff;
    --soft: #eef0f4;
    --ink: #1d1d1f;
    --ink2: #3f4550;
    --muted: #7b818d;
    --muted2: #9ea4b0;
    --line: #e5e7ec;
    --line2: #eef0f5;
    --accent: #1F6F5C;
    --accent-weak: rgba(31, 111, 92, .11);
    --o: #CF5428;
    --o-weak: #fdeee7;
    --g: #A86F12;
    --g-weak: #f6efe2;
    --b: #2F6FEB;
    --b-weak: #e9f0fd;
    --r: 14px;
    --btn-r: 9px;
    --shadow: 0 2px 10px rgba(16, 24, 40, .05);
    --shadow-hover: 0 14px 30px rgba(16, 24, 40, .12);
    --font: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace;
  }

  /* B 苹果风 */
  body.skin-B {
    --bg: #f5f5f7; --card: #ffffff; --soft: #ebebf0; --ink: #1d1d1f; --ink2: #424245;
    --muted: #86868b; --muted2: #a1a1a6; --line: #e5e5ea; --line2: #f0f0f4;
    --accent: #0071e3; --accent-weak: rgba(0, 113, 227, .10);
    --r: 18px; --btn-r: 18px;
  }
  /* C 暗色 */
  body.skin-C {
    --bg: #0c0d10; --card: #15171c; --soft: #1c1f26; --ink: #e8e8ec; --ink2: #c4c6cf;
    --muted: #8b8e99; --muted2: #686b75; --line: #252830; --line2: #1d2027;
    --accent: #5fe0b5; --accent-weak: rgba(95, 224, 181, .14);
    --o: #ff9f6b; --o-weak: rgba(255, 159, 107, .14);
    --g: #f5c76b; --g-weak: rgba(245, 199, 107, .14);
    --b: #7fb0ff; --b-weak: rgba(127, 176, 255, .14);
    --shadow: 0 4px 16px rgba(0, 0, 0, .35);
    --shadow-hover: 0 16px 34px rgba(0, 0, 0, .6);
  }
  /* D 杂志风 */
  body.skin-D {
    --bg: #f6f3ec; --card: #fffdf8; --soft: #ede7da; --ink: #231f1a; --ink2: #4a4339;
    --muted: #7d7365; --muted2: #a39887; --line: #e2dacb; --line2: #ece5d8;
    --accent: #8a5a12; --accent-weak: rgba(138, 90, 18, .12);
    --r: 10px; --btn-r: 6px;
  }
  /* E 奶油风 */
  body.skin-E {
    --bg: #f8f0e5; --card: #fffaf2; --soft: #efe3d2; --ink: #3b2921; --ink2: #5c4438;
    --muted: #7c6558; --muted2: #a48d7e; --line: #dfcdb8; --line2: #eadbc9;
    --accent: #b07818; --accent-weak: rgba(176, 120, 24, .13);
    --r: 16px; --btn-r: 12px;
  }
  /* F 海军风 */
  body.skin-F {
    --bg: #eef3f9; --card: #ffffff; --soft: #e1ebf6; --ink: #142842; --ink2: #2e4766;
    --muted: #5d7594; --muted2: #879db8; --line: #d0dceb; --line2: #e2ebf5;
    --accent: #1e4d8c; --accent-weak: rgba(30, 77, 140, .11);
    --r: 12px; --btn-r: 8px;
  }
  /* G 科技风 */
  body.skin-G {
    --bg: #081520; --card: #102536; --soft: #163147; --ink: #ecf8ff; --ink2: #bdd8ea;
    --muted: #82a8c2; --muted2: #597e99; --line: #23475c; --line2: #193647;
    --accent: #22d3ee; --accent-weak: rgba(34, 211, 238, .15);
    --o: #fb923c; --o-weak: rgba(251, 146, 60, .15);
    --g: #4ade80; --g-weak: rgba(74, 222, 128, .15);
    --b: #60a5fa; --b-weak: rgba(96, 165, 250, .15);
    --r: 8px; --btn-r: 6px;
  }

  * { box-sizing: border-box; }
  html { scrollbar-gutter: stable; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 13.5px/1.55 var(--font);
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }

  /* ================= 二级功能顶栏（与「会动网页」1:1 统一） ================= */
  .wb-header {
    position: sticky;
    top: var(--site-nav-h);
    z-index: 80;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 20px;
    background: color-mix(in srgb, var(--card) 92%, transparent);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  .mode-switch {
    display: flex;
    background: var(--soft);
    padding: 3px;
    border-radius: 11px;
    border: 1px solid var(--line2);
    gap: 3px;
    flex-wrap: wrap;
  }
  .mode-btn {
    border: 0;
    background: transparent;
    color: var(--ink2);
    padding: 6px 13px;
    border-radius: 8px;
    font-size: 12.5px;
    cursor: pointer;
    transition: .14s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .mode-btn:hover { color: var(--ink); background: rgba(128, 128, 128, .07); }
  .mode-btn.on {
    background: var(--card);
    color: var(--accent);
    font-weight: 700;
    box-shadow: 0 1px 4px rgba(0, 0, 0, .09);
  }
  .mode-btn .cnt-pill {
    font-size: 10.5px;
    padding: 1px 6px;
    border-radius: 999px;
    background: var(--accent-weak);
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }

  .wb-tools {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .skin-bar {
    display: flex;
    align-items: center;
    background: var(--soft);
    padding: 2px;
    border-radius: 9px;
    border: 1px solid var(--line2);
    gap: 2px;
  }
  .skin-btn {
    border: 0;
    background: transparent;
    color: var(--muted);
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 11.5px;
    cursor: pointer;
    transition: .12s;
  }
  .skin-btn:hover { color: var(--ink); }
  .skin-btn.on {
    background: var(--card);
    color: var(--ink);
    font-weight: 600;
    box-shadow: 0 1px 3px rgba(0, 0, 0, .08);
  }

  .btn {
    height: 32px;
    padding: 0 12px;
    border-radius: var(--btn-r);
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink2);
    font-size: 12px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: .14s;
    text-decoration: none;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--muted2); color: var(--ink); background: var(--soft); }
  .btn.is-on { background: var(--accent-weak); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .btn.pri { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  body.skin-C .btn.pri, body.skin-G .btn.pri { color: #091318; }
  .btn.pri:hover { opacity: .92; }

  /* ================= 经典双栏主体（与「会动网页」1:1 统一） ================= */
  .arch-A { display: flex; min-height: calc(100vh - var(--site-nav-h) - var(--wb-bar-h)); }
  .a-side {
    width: 248px;
    flex: none;
    background: var(--card);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    position: sticky;
    top: calc(var(--site-nav-h) + var(--wb-bar-h));
    height: calc(100vh - var(--site-nav-h) - var(--wb-bar-h));
  }
  .a-side.is-collapsed { display: none; }
  .a-nav { flex: 1; overflow-y: auto; padding: 10px 10px 18px; scrollbar-width: thin; }
  .a-sec { margin-bottom: 6px; }
  .a-grp {
    font-size: 11px;
    letter-spacing: .06em;
    color: var(--muted);
    padding: 9px 10px 6px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    user-select: none;
    border-radius: 8px;
    transition: .12s;
  }
  .a-grp:hover { background: var(--soft); color: var(--ink); }
  .a-grp .caret { font-size: 11px; color: var(--muted2); transition: transform .15s; }
  .a-sec.folded .a-grp .caret { transform: rotate(-90deg); }
  .a-sec.folded .a-sec-body { display: none; }
  .a-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    border-radius: 9px;
    cursor: pointer;
    font-size: 13px;
    color: var(--ink2);
    transition: .12s;
    border: 0;
    background: transparent;
    width: 100%;
    text-align: left;
  }
  .a-row:hover { background: var(--soft); color: var(--ink); }
  .a-row.on { background: var(--accent-weak); color: var(--accent); font-weight: 600; }
  .a-row .n { margin-left: auto; font-size: 11px; color: var(--muted2); font-variant-numeric: tabular-nums; }
  .a-row.on .n { color: var(--accent); }
  .a-row.is-sub { padding-left: 22px; font-size: 12.5px; }

  .a-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .a-top {
    position: sticky;
    top: calc(var(--site-nav-h) + var(--wb-bar-h));
    z-index: 20;
    padding: 11px 22px;
    background: color-mix(in srgb, var(--bg) 90%, transparent);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .search-box {
    flex: 1;
    min-width: 220px;
    height: 35px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 0 12px;
  }
  .search-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-weak); }
  .search-box input { flex: 1; border: 0; outline: 0; background: transparent; font-size: 13px; min-width: 0; }
  .search-box kbd { font-size: 10.5px; color: var(--muted2); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }

  .chip-bar {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    padding-top: 2px;
  }
  .chip-bar .lb { font-size: 11px; color: var(--muted2); margin-right: 2px; }
  .fchip {
    font-size: 11.5px;
    padding: 3px 10px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink2);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: .12s;
  }
  .fchip:hover { border-color: var(--muted2); color: var(--ink); }
  .fchip.on { background: var(--accent-weak); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .fchip .n { font-size: 10px; opacity: .75; }

  .a-mob-cats {
    display: none;
    width: 100%;
    gap: 6px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding: 2px 0 4px;
  }
  .a-mob-cats::-webkit-scrollbar { display: none; }
  .a-mob-cats .fchip { flex: none; white-space: nowrap; }

  .a-content { padding: 18px 22px 54px; flex: 1; min-width: 0; }
  .sj-sec { margin-top: 22px; }
  .sj-sec:first-child { margin-top: 0; }
  .sj-sec-head {
    display: flex;
    align-items: baseline;
    gap: 6px 10px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .sj-sec-head h2 { margin: 0; font-size: 15.5px; font-weight: 800; white-space: nowrap; }
  .sj-sec-head span { font-size: 12px; color: var(--muted); }

  /* 卡片墙（对齐会动网页 .wall-5 响应式列数） */
  .wall-5 {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 15px 14px;
  }
  @media (max-width: 1440px) { .wall-5 { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  @media (max-width: 1120px) { .wall-5 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 960px) {
    .wb-header { position: static !important; padding: 10px 14px; gap: 8px; }
    .a-top { position: static !important; padding: 10px 14px; gap: 8px; }
    .a-side { width: 210px; top: var(--site-nav-h) !important; height: calc(100vh - var(--site-nav-h)) !important; }
    .a-content { padding: 14px 14px 40px; }
  }
  @media (max-width: 820px) {
    .a-side { display: none !important; }
    .a-mob-cats { display: flex; }
    .wall-5 { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    #toggleSideBtn { display: none; }
  }
  @media (max-width: 640px) {
    html, body { overflow-x: clip; max-width: 100vw; }
    .mode-switch { width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .mode-btn { justify-content: center; padding: 7px 6px; font-size: 11.5px; gap: 3px; }
    .mode-btn .cnt-pill { display: none; }
    .wb-tools { width: 100%; overflow-x: auto; flex-wrap: nowrap; scrollbar-width: none; }
    .wb-tools::-webkit-scrollbar { display: none; }
    .skin-bar { flex: none; }
    .search-box { min-width: 0; width: 100%; flex: 1 1 100%; }
    .search-box kbd { display: none; }
    .a-top .btn { font-size: 11.5px; padding: 0 9px; height: 30px; }
    .chip-bar { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding-bottom: 4px; }
    .chip-bar::-webkit-scrollbar { display: none; }
    .chip-bar .lb, .chip-bar .fchip { flex: none; white-space: nowrap; }
    .wall-5 { grid-template-columns: 1fr; gap: 12px; }
  }

  /* 卡片设计 */
  .sj-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--r);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .sj-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-hover);
    border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
  }
  .sj-thumb {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #0d0f13;
    overflow: hidden;
  }
  .sj-thumb.is-motion { aspect-ratio: 539 / 208; }
  .sj-thumb img, .sj-thumb video, .sj-thumb canvas {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .sj-thumb.is-motion canvas { object-fit: contain; }
  .sj-badge-no {
    position: absolute;
    left: 8px;
    top: 8px;
    padding: 2px 7px;
    border-radius: 6px;
    background: rgba(12, 14, 18, .76);
    color: #fff;
    font: 700 11px/1.3 var(--mono);
    backdrop-filter: blur(6px);
    z-index: 2;
  }
  .sj-badge-live {
    position: absolute;
    right: 8px;
    top: 8px;
    padding: 2px 7px;
    border-radius: 999px;
    background: rgba(12, 14, 18, .68);
    color: #86efac;
    font-size: 10px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    backdrop-filter: blur(6px);
    z-index: 2;
  }
  .sj-badge-live i {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #22c55e;
    display: block;
  }
  .sj-body {
    padding: 10px 12px 8px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .sj-name {
    font-size: 13.5px;
    font-weight: 700;
    line-height: 1.3;
    color: var(--ink);
  }
  .sj-en {
    font-size: 11px;
    color: var(--muted2);
    font-family: var(--mono);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sj-desc {
    font-size: 12px;
    color: var(--ink2);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-top: 2px;
  }
  .sj-foot {
    padding: 0 12px 10px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    font-size: 11px;
    color: var(--muted);
  }
  .sj-tag {
    padding: 2px 7px;
    border-radius: 6px;
    background: var(--soft);
    color: var(--ink2);
    font-weight: 600;
  }
  .sj-tag.is-accent { background: var(--accent-weak); color: var(--accent); }

  .sj-empty {
    padding: 52px 20px;
    text-align: center;
    color: var(--muted);
    background: var(--card);
    border: 1px dashed var(--line);
    border-radius: var(--r);
    margin-top: 8px;
  }

  /* 详情弹窗 */
  .sj-modal-mask {
    position: fixed;
    inset: 0;
    z-index: 160;
    background: rgba(8, 10, 14, .68);
    backdrop-filter: blur(6px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .sj-modal-mask.is-open { display: flex; }
  .sj-modal {
    width: 100%;
    max-width: 780px;
    max-height: 90vh;
    overflow-y: auto;
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: 0 24px 64px rgba(0, 0, 0, .4);
    padding: 20px 22px 22px;
  }
  .sj-modal-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
  }
  .sj-modal-head h3 { margin: 0; font-size: 18px; font-weight: 800; line-height: 1.3; }
  .sj-close {
    width: 32px; height: 32px; border-radius: 9px;
    border: 1px solid var(--line);
    background: var(--soft);
    cursor: pointer; font-size: 16px; line-height: 1;
    flex: 0 0 auto;
  }
  .sj-modal-media {
    width: 100%;
    border-radius: 12px;
    overflow: hidden;
    background: #0d0f13;
    border: 1px solid var(--line);
    margin-bottom: 14px;
  }
  .sj-modal-media img, .sj-modal-media video, .sj-modal-media canvas {
    width: 100%;
    max-height: 420px;
    object-fit: contain;
    display: block;
  }
  .sj-meta-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 12px;
    font-size: 12px;
  }
  .sj-modal-desc {
    font-size: 14px;
    line-height: 1.75;
    color: var(--ink);
    margin-bottom: 10px;
  }
  .sj-modal-box {
    background: var(--soft);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 12px;
    font-size: 12.5px;
    color: var(--ink2);
    line-height: 1.65;
  }

<script>
(function () {
  const DATA = window.SHIJUE_DATA || { styles: [], components: [], motions: [], styleCats: [], compCats: [], motionGroups: [], counts: {} };
  const SKIN_NAMES = { A: '标准', B: '苹果', C: '暗色', D: '杂志', E: '奶油', F: '海军', G: '科技' };

  const state = {
    tab: 'style',
    styleCat: '',
    styleQuery: '',
    compCat: '',
    compEnergy: '',
    compQuery: '',
    motionGroup: '',
    motionSub: '',
    motionQuery: '',
    skin: 'A',
    autoPlay: true,
    sideCollapsed: false,
    foldedGroups: {}
  };

  let initialItem = '';
  try {
    const p = new URLSearchParams(location.search);
    if (['style', 'component', 'motion'].includes(p.get('tab'))) state.tab = p.get('tab');
    initialItem = (p.get('item') || '').trim();
  } catch (e) {}

  const $ = (id) => document.getElementById(id);
  const loadedPacks = new Set();
  const loadingPacks = new Map();
  let videoObs = null;
  let motionObs = null;
  let motionRaf = 0;
  let modalRaf = 0;
  let lastFiltered = [];

  function syncBarHeight() {
    const h = Math.round(($('wbHeader') && $('wbHeader').getBoundingClientRect().height) || 53);
    document.documentElement.style.setProperty('--wb-bar-h', h + 'px');
  }
  window.addEventListener('resize', syncBarHeight);

  function toast(msg) {
    const el = $('sjToast');
    el.textContent = msg;
    el.classList.add('is-show');
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove('is-show'), 2200);
  }

  function copyText(txt, okMsg) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(() => toast(okMsg)).catch(() => fallbackCopy(txt, okMsg));
    } else {
      fallbackCopy(txt, okMsg);
    }
  }
  function fallbackCopy(txt, okMsg) {
    const ta = document.createElement('textarea');
    ta.value = txt;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); toast(okMsg); } catch (e) { toast('复制失败，请手动选中'); }
    ta.remove();
  }

  function esc(s) {
    return String(s || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
  }

  function setSkin(s, persist = true) {
    if (!/^[A-G]$/.test(s || '')) s = 'A';
    state.skin = s;
    document.body.className = document.body.className.replace(/\bskin-[A-G]\b/g, '').trim() + ' skin-' + s;
    if (persist) {
      try { localStorage.setItem('guiji_shijue_skin', s); } catch (e) {}
    }
    renderSkins();
  }

  function renderSkins() {
    const box = $('sjSkins');
    box.innerHTML = Object.keys(SKIN_NAMES).map(k =>
      `<button class="skin-btn${state.skin === k ? ' on' : ''}" data-skin="${k}" title="${SKIN_NAMES[k]}皮肤">${SKIN_NAMES[k]}</button>`
    ).join('');
    box.querySelectorAll('button').forEach(b => b.onclick = () => setSkin(b.dataset.skin, true));
  }

  function loadMotionPack(packId) {
    if (!packId) return Promise.resolve(null);
    if (window.MotionPrompt && window.MotionPrompt.packs && window.MotionPrompt.packs[packId]) {
      return Promise.resolve(window.MotionPrompt.packs[packId]);
    }
    if (loadingPacks.has(packId)) return loadingPacks.get(packId);
    const pr = new Promise((resolve) => {
      const s = document.createElement('script');
      s.src = 'motion-packs/' + encodeURIComponent(packId) + '.js';
      s.onload = () => {
        loadedPacks.add(packId);
        resolve((window.MotionPrompt && window.MotionPrompt.packs && window.MotionPrompt.packs[packId]) || null);
      };
      s.onerror = () => resolve(null);
      document.head.appendChild(s);
    });
    loadingPacks.set(packId, pr);
    return pr;
  }

  function stopObservers() {
    if (motionRaf) { cancelAnimationFrame(motionRaf); motionRaf = 0; }
    if (motionObs) { try { motionObs.disconnect(); } catch (e) {} motionObs = null; }
    if (videoObs) { try { videoObs.disconnect(); } catch (e) {} videoObs = null; }
  }

  function playCardVideo(v) {
    if (!v || !v.dataset.src) return;
    if (!v.getAttribute('src')) {
      v.src = v.dataset.src;
      v.load();
    }
    const pr = v.play();
    if (pr && pr.catch) pr.catch(() => {});
  }

  function pauseCardVideo(v) {
    if (!v) return;
    try { v.pause(); } catch (e) {}
  }

  function setupVideoObserver(container) {
    const videos = Array.from(container.querySelectorAll('video[data-src]'));
    if (!videos.length) return;

    videos.forEach(v => {
      const card = v.closest('.sj-card');
      if (!card) return;
      card.addEventListener('mouseenter', () => {
        if (!state.autoPlay) playCardVideo(v);
      });
      card.addEventListener('mouseleave', () => {
        if (!state.autoPlay) pauseCardVideo(v);
      });
    });

    if (!state.autoPlay) return;
    videoObs = new IntersectionObserver((entries) => {
      for (const ent of entries) {
        const v = ent.target;
        if (ent.isIntersecting) playCardVideo(v);
        else pauseCardVideo(v);
      }
    }, { rootMargin: '120px 0px', threshold: 0.05 });

    videos.forEach(v => videoObs.observe(v));
  }

  function closeModal() {
    if (modalRaf) { cancelAnimationFrame(modalRaf); modalRaf = 0; }
    const mv = $('sjModal').querySelector('video');
    if (mv) { try { mv.pause(); } catch (e) {} }
    const mask = $('sjModalMask');
    mask.classList.remove('is-open');
    mask.setAttribute('aria-hidden', 'true');
  }
  $('sjModalMask').addEventListener('click', (e) => {
    if (e.target === $('sjModalMask')) closeModal();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      $('sjSearch').focus();
      $('sjSearch').select();
    }
  });

  function renderTabs() {
    const tabs = [
      ['style', '🎨 整片风格', DATA.styles.length],
      ['component', '🎬 镜头组件', DATA.components.length],
      ['motion', '⚡ 实时动效', DATA.motions.length]
    ];
    const host = $('sjTabs');
    host.innerHTML = tabs.map(([k, lbl, n]) =>
      `<button class="mode-btn${state.tab === k ? ' on' : ''}" data-tab="${k}" role="tab">${lbl}<span class="cnt-pill">${n}</span></button>`
    ).join('');
    host.querySelectorAll('button').forEach(b => {
      b.onclick = () => {
        if (state.tab === b.dataset.tab) return;
        state.tab = b.dataset.tab;
        try {
          const u = new URL(location.href);
          u.searchParams.set('tab', state.tab);
          u.searchParams.delete('item');
          history.replaceState(null, '', u.pathname + u.search + u.hash);
        } catch (e) {}
        renderAll();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };
    });
  }

  function syncTopToolbar(placeholder, queryVal, hasFilter, shown, total) {
    const inp = $('sjSearch');
    if (inp.placeholder !== placeholder) inp.placeholder = placeholder;
    if (document.activeElement !== inp && inp.value !== queryVal) inp.value = queryVal;
    $('clearFilterBtn').style.display = hasFilter ? '' : 'none';
    $('sjCountText').textContent = `显示 ${shown} / ${total} 项`;
    const ap = $('autoPlayBtn');
    ap.style.display = state.tab === 'motion' ? 'none' : '';
    ap.classList.toggle('is-on', state.autoPlay);
    ap.textContent = state.autoPlay ? '▶ 自动动图：开' : '⏸ 仅悬停动图';
  }

  function buildSideSection(secId, title, rowsHtml) {
    const folded = !!state.foldedGroups[secId];
    return `
      <div class="a-sec${folded ? ' folded' : ''}" data-sec="${esc(secId)}">
        <div class="a-grp" data-toggle-sec="${esc(secId)}"><span>${esc(title)}</span><span class="caret">▾</span></div>
        <div class="a-sec-body">${rowsHtml}</div>
      </div>
    `;
  }

  function bindSideToggles(nav) {
    nav.querySelectorAll('[data-toggle-sec]').forEach(el => {
      el.onclick = () => {
        const sid = el.getAttribute('data-toggle-sec');
        state.foldedGroups[sid] = !state.foldedGroups[sid];
        el.closest('.a-sec').classList.toggle('folded', state.foldedGroups[sid]);
      };
    });
  }

  // ==================== ① 风格（136 条全量循环 MP4 动态预览） ====================
  function renderStylesTab() {
    stopObservers();
    const list = DATA.styles || [];
    const cats = DATA.styleCats || [];

    // 左侧导航树
    const nav = $('aSideNav');
    const overviewRows = `
      <button type="button" class="a-row${!state.styleCat ? ' on' : ''}" data-cat=""><span>📁 全部风格</span><span class="n">${list.length}</span></button>
    `;
    const catRows = cats.map(cat => {
      const cnt = list.filter(x => x.cat === cat).length;
      if (!cnt) return '';
      return `<button type="button" class="a-row${state.styleCat === cat ? ' on' : ''}" data-cat="${esc(cat)}"><span>${esc(cat)}</span><span class="n">${cnt}</span></button>`;
    }).join('');
    nav.innerHTML = buildSideSection('style_top', '精选导航', overviewRows) + buildSideSection('style_cats', '视觉流派', catRows);
    bindSideToggles(nav);
    nav.querySelectorAll('.a-row').forEach(btn => {
      btn.onclick = () => { state.styleCat = btn.dataset.cat; renderStylesTab(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
    });

    // 手机端横向分类条
    const mob = $('aMobCats');
    mob.innerHTML = `<button type="button" class="fchip${!state.styleCat ? ' on' : ''}" data-cat="">全部 <span class="n">${list.length}</span></button>` +
      cats.map(cat => {
        const cnt = list.filter(x => x.cat === cat).length;
        return cnt ? `<button type="button" class="fchip${state.styleCat === cat ? ' on' : ''}" data-cat="${esc(cat)}">${esc(cat)} <span class="n">${cnt}</span></button>` : '';
      }).join('');
    mob.querySelectorAll('.fchip').forEach(btn => {
      btn.onclick = () => { state.styleCat = btn.dataset.cat; renderStylesTab(); };
    });

    $('sjChipBar').style.display = 'none';

    const q = state.styleQuery.toLowerCase();
    const filtered = list.filter(s => {
      if (state.styleCat && s.cat !== state.styleCat) return false;
      if (q && !`${s.id} ${s.name} ${s.en} ${s.cat} ${s.desc} ${s.fit} ${(s.tech || []).join(' ')}`.toLowerCase().includes(q)) return false;
      return true;
    });
    lastFiltered = filtered;
    syncTopToolbar('搜索风格名、编号（如 S07 / S21）或画面关键词…', state.styleQuery, !!(state.styleCat || state.styleQuery), filtered.length, list.length);

    const content = $('sjContent');
    if (!filtered.length) {
      content.innerHTML = '<div class="sj-empty">没有找到匹配的风格，试试切换左侧分类或清空搜索词。</div>';
      return;
    }

    content.innerHTML = `
      <section class="sj-sec">
        <div class="sj-sec-head">
          <h2>${esc(state.styleCat || '全部整片风格')}</h2>
          <span>共 ${filtered.length} 种 · 全量动态预览，点开卡片看高清循环与视觉描述</span>
        </div>
        <div class="wall-5" id="sjStyleGrid"></div>
      </section>
    `;
    const grid = $('sjStyleGrid');
    const frag = document.createDocumentFragment();
    for (const s of filtered) {
      const card = document.createElement('article');
      card.className = 'sj-card';
      let mediaHtml = '';
      if (s.vid) {
        mediaHtml = `<video muted loop playsinline preload="none" poster="${esc(s.img || '')}" data-src="${esc(s.vid)}"></video>`;
      } else if (s.anim || s.img) {
        mediaHtml = `<img src="${esc(s.anim || s.img)}" alt="${esc(s.name)}" loading="lazy" decoding="async">`;
      }
      card.innerHTML = `
        <div class="sj-thumb">
          ${mediaHtml}
          <span class="sj-badge-no">${esc(s.id)}</span>
          ${(s.vid || s.anim) ? '<span class="sj-badge-live"><i></i>动态</span>' : ''}
        </div>
        <div class="sj-body">
          <div class="sj-name">${esc(s.name)}</div>
          ${s.en ? `<div class="sj-en">${esc(s.en)}</div>` : ''}
          ${s.desc ? `<div class="sj-desc">${esc(s.desc)}</div>` : ''}
        </div>
        <div class="sj-foot">
          <span class="sj-tag is-accent">${esc(s.cat)}</span>
          ${(s.tech || []).slice(0, 2).map(t => `<span class="sj-tag">${esc(t)}</span>`).join('')}
        </div>
      `;
      card.onclick = () => openStyleModal(s);
      frag.appendChild(card);
    }
    grid.appendChild(frag);
    setupVideoObserver(grid);
  }

  function openStyleModal(s) {
    if (modalRaf) { cancelAnimationFrame(modalRaf); modalRaf = 0; }
    const modal = $('sjModal');
    let mediaHtml = '';
    if (s.vid) {
      mediaHtml = `<div class="sj-modal-media"><video src="${esc(s.vid)}" poster="${esc(s.img || '')}" autoplay muted loop playsinline controls></video></div>`;
    } else if (s.anim || s.img) {
      mediaHtml = `<div class="sj-modal-media"><img src="${esc(s.anim || s.img)}" alt="${esc(s.name)}"></div>`;
    }
    modal.innerHTML = `
      <div class="sj-modal-head">
        <h3>${esc(s.id)} · ${esc(s.name)}${s.en ? ` <small style="font-weight:500;color:var(--muted);font-size:13px">${esc(s.en)}</small>` : ''}</h3>
        <button class="sj-close" id="sjCloseBtn" aria-label="关闭">×</button>
      </div>
      ${mediaHtml}
      <div class="sj-meta-row">
        <span class="sj-tag is-accent">${esc(s.cat)}</span>
        ${(s.vid || s.anim) ? '<span class="sj-tag">动态循环预览</span>' : ''}
        ${(s.tech || []).map(t => `<span class="sj-tag">${esc(t)}</span>`).join('')}
      </div>
      ${s.desc ? `<div class="sj-modal-desc">${esc(s.desc)}</div>` : ''}
      ${s.fit ? `<div class="sj-modal-box"><b>适合题材：</b>${esc(s.fit)}</div>` : ''}
      ${(s.how && s.how.length) ? `<div class="sj-modal-box"><b>视觉要点：</b><ul>${s.how.map(h => `<li>${esc(h)}</li>`).join('')}</ul></div>` : ''}
      <div class="sj-modal-acts">
        <button class="btn pri" id="sjCopyBtn">复制中文视觉描述</button>
      </div>
    `;
    $('sjCloseBtn').onclick = closeModal;
    $('sjCopyBtn').onclick = () => {
      const lines = [
        `视觉风格参考：「${s.name}」${s.en ? '（' + s.en + '）' : ''}`,
        s.desc ? `- 画面特点：${s.desc}` : '',
        (s.tech && s.tech.length) ? `- 表现形式：${s.tech.join('、')}` : '',
        s.fit ? `- 适用题材：${s.fit}` : ''
      ].filter(Boolean);
      copyText(lines.join('\n'), '已复制风格描述词');
    };
    const mask = $('sjModalMask');
    mask.classList.add('is-open');
    mask.setAttribute('aria-hidden', 'false');
  }

  // ==================== ② 镜头组件（124 条全量循环 MP4 动态预览） ====================
  function renderCompsTab() {
    stopObservers();
    const list = DATA.components || [];
    const cats = DATA.compCats || [];

    const nav = $('aSideNav');
    const overviewRows = `
      <button type="button" class="a-row${!state.compCat ? ' on' : ''}" data-cat=""><span>📁 全部组件</span><span class="n">${list.length}</span></button>
    `;
    const catRows = cats.map(cat => {
      const cnt = list.filter(x => x.cat === cat).length;
      if (!cnt) return '';
      return `<button type="button" class="a-row${state.compCat === cat ? ' on' : ''}" data-cat="${esc(cat)}"><span>${esc(cat)}</span><span class="n">${cnt}</span></button>`;
    }).join('');
    nav.innerHTML = buildSideSection('comp_top', '精选导航', overviewRows) + buildSideSection('comp_cats', '镜头场景', catRows);
    bindSideToggles(nav);
    nav.querySelectorAll('.a-row').forEach(btn => {
      btn.onclick = () => { state.compCat = btn.dataset.cat; state.compEnergy = ''; renderCompsTab(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
    });

    const mob = $('aMobCats');
    mob.innerHTML = `<button type="button" class="fchip${!state.compCat ? ' on' : ''}" data-cat="">全部 <span class="n">${list.length}</span></button>` +
      cats.map(cat => {
        const cnt = list.filter(x => x.cat === cat).length;
        return cnt ? `<button type="button" class="fchip${state.compCat === cat ? ' on' : ''}" data-cat="${esc(cat)}">${esc(cat)} <span class="n">${cnt}</span></button>` : '';
      }).join('');
    mob.querySelectorAll('.fchip').forEach(btn => {
      btn.onclick = () => { state.compCat = btn.dataset.cat; state.compEnergy = ''; renderCompsTab(); };
    });

    // 能量快捷筛选条（同会动网页 .chip-bar）
    const scope = state.compCat ? list.filter(x => x.cat === state.compCat) : list;
    const chipBar = $('sjChipBar');
    chipBar.style.display = 'flex';
    chipBar.innerHTML = `<span class="lb">节奏与能量：</span>` +
      [['', '全部能量'], ['低', '低能量·克制'], ['中', '中能量·常规'], ['高', '高能量·强冲击']].map(([v, l]) => {
        const cnt = v ? scope.filter(x => String(x.energy || '').includes(v)).length : scope.length;
        if (v && !cnt) return '';
        return `<button type="button" class="fchip${state.compEnergy === v ? ' on' : ''}" data-energy="${v}">${l} <span class="n">${cnt}</span></button>`;
      }).join('');
    chipBar.querySelectorAll('.fchip').forEach(b => {
      b.onclick = () => { state.compEnergy = b.dataset.energy; renderCompsTab(); };
    });

    const q = state.compQuery.toLowerCase();
    const filtered = list.filter(c => {
      if (state.compCat && c.cat !== state.compCat) return false;
      if (state.compEnergy && !String(c.energy || '').includes(state.compEnergy)) return false;
      if (q && !`${c.cn} ${c.name} ${c.cat} ${c.one} ${c.fit}`.toLowerCase().includes(q)) return false;
      return true;
    });
    lastFiltered = filtered;
    syncTopToolbar('搜索组件中文名、镜头场景或英文…', state.compQuery, !!(state.compCat || state.compEnergy || state.compQuery), filtered.length, list.length);

    const content = $('sjContent');
    if (!filtered.length) {
      content.innerHTML = '<div class="sj-empty">没有符合条件的镜头组件，试试切换分类或清空搜索词。</div>';
      return;
    }

    content.innerHTML = '';
    const showCats = state.compCat ? [state.compCat] : cats.filter(cat => filtered.some(c => c.cat === cat));
    for (const cat of showCats) {
      const group = filtered.filter(c => c.cat === cat);
      const sec = document.createElement('section');
      sec.className = 'sj-sec';
      sec.innerHTML = `<div class="sj-sec-head"><h2>${esc(cat)}</h2><span>${group.length} 个组件 · 进屏自动播放</span></div><div class="wall-5"></div>`;
      const grid = sec.querySelector('.wall-5');
      for (const c of group) {
        const card = document.createElement('article');
        card.className = 'sj-card';
        let mediaHtml = '';
        if (c.vid) {
          mediaHtml = `<video muted loop playsinline preload="none" poster="${esc(c.img || '')}" data-src="${esc(c.vid)}"></video>`;
        } else if (c.anim || c.img) {
          mediaHtml = `<img src="${esc(c.anim || c.img)}" alt="${esc(c.cn)}" loading="lazy" decoding="async">`;
        }
        card.innerHTML = `
          <div class="sj-thumb">
            ${mediaHtml}
            ${(c.vid || c.anim) ? '<span class="sj-badge-live"><i></i>动态</span>' : ''}
          </div>
          <div class="sj-body">
            <div class="sj-name">${esc(c.cn)}</div>
            <div class="sj-en">${esc(c.name)}</div>
            ${c.one ? `<div class="sj-desc">${esc(c.one)}</div>` : ''}
          </div>
          <div class="sj-foot">
            ${c.energy ? `<span class="sj-tag">能量 ${esc(c.energy)}</span>` : ''}
            ${c.dur ? `<span>${esc(c.dur)}</span>` : ''}
          </div>
        `;
        card.onclick = () => openCompModal(c);
        grid.appendChild(card);
      }
      content.appendChild(sec);
    }
    setupVideoObserver(content);
  }

  function openCompModal(c) {
    if (modalRaf) { cancelAnimationFrame(modalRaf); modalRaf = 0; }
    const modal = $('sjModal');
    let mediaHtml = '';
    if (c.vid) {
      mediaHtml = `<div class="sj-modal-media"><video src="${esc(c.vid)}" poster="${esc(c.img || '')}" autoplay muted loop playsinline controls></video></div>`;
    } else if (c.anim || c.img) {
      mediaHtml = `<div class="sj-modal-media"><img src="${esc(c.anim || c.img)}" alt="${esc(c.cn)}"></div>`;
    }
    modal.innerHTML = `
      <div class="sj-modal-head">
        <h3>${esc(c.cn)} <small style="font-weight:500;color:var(--muted);font-size:13px">${esc(c.name)}</small></h3>
        <button class="sj-close" id="sjCloseBtn" aria-label="关闭">×</button>
      </div>
      ${mediaHtml}
      <div class="sj-meta-row">
        <span class="sj-tag is-accent">${esc(c.cat)}</span>
        ${c.energy ? `<span class="sj-tag">能量：${esc(c.energy)}</span>` : ''}
        ${c.dur ? `<span class="sj-tag">参考时长：${esc(c.dur)}</span>` : ''}
      </div>
      ${c.one ? `<div class="sj-modal-desc">${esc(c.one)}</div>` : ''}
      ${c.fit ? `<div class="sj-modal-box"><b>适用场景：</b>${esc(c.fit)}</div>` : ''}
      <div class="sj-modal-acts">
        <button class="btn pri" id="sjCopyBtn">复制组件中文描述</button>
      </div>
    `;
    $('sjCloseBtn').onclick = closeModal;
    $('sjCopyBtn').onclick = () => {
      const lines = [
        `镜头组件参考：「${c.cn}」（${c.name} · ${c.cat}）`,
        c.one ? `- 画面效果：${c.one}` : '',
        c.fit ? `- 适用场景：${c.fit}` : '',
        c.dur ? `- 参考时长：${c.dur}` : ''
      ].filter(Boolean);
      copyText(lines.join('\n'), '已复制组件描述词');
    };
    const mask = $('sjModalMask');
    mask.classList.add('is-open');
    mask.setAttribute('aria-hidden', 'false');
  }

  // ==================== ③ 实时动效（168 条纯代码 Canvas 2D 实时动画） ====================
  function renderMotionsTab() {
    stopObservers();
    const list = DATA.motions || [];
    const groups = DATA.motionGroups || ['动态图形', '镜头与转场', 'UI 与网页'];

    // 左侧导航树：3 大类可折叠分组，每组展开即 18 个子分类
    const nav = $('aSideNav');
    let navHtml = buildSideSection('motion_top', '精选导航',
      `<button type="button" class="a-row${!state.motionGroup && !state.motionSub ? ' on' : ''}" data-grp="" data-sub=""><span>⚡ 全部动效</span><span class="n">${list.length}</span></button>`
    );
    for (const g of groups) {
      const scope = list.filter(x => x.grp === g);
      if (!scope.length) continue;
      const subs = [...new Set(scope.map(x => x.sub).filter(Boolean))];
      let rows = `<button type="button" class="a-row${state.motionGroup === g && !state.motionSub ? ' on' : ''}" data-grp="${esc(g)}" data-sub=""><span>全部 ${esc(g)}</span><span class="n">${scope.length}</span></button>`;
      rows += subs.map(sub => {
        const cnt = scope.filter(x => x.sub === sub).length;
        const on = state.motionGroup === g && state.motionSub === sub;
        return `<button type="button" class="a-row is-sub${on ? ' on' : ''}" data-grp="${esc(g)}" data-sub="${esc(sub)}"><span>${esc(sub)}</span><span class="n">${cnt}</span></button>`;
      }).join('');
      navHtml += buildSideSection('motion_' + g, `${g} (${scope.length})`, rows);
    }
    nav.innerHTML = navHtml;
    bindSideToggles(nav);
    nav.querySelectorAll('.a-row').forEach(btn => {
      btn.onclick = () => {
        state.motionGroup = btn.dataset.grp;
        state.motionSub = btn.dataset.sub;
        renderMotionsTab();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };
    });

    const mob = $('aMobCats');
    mob.innerHTML = `<button type="button" class="fchip${!state.motionGroup ? ' on' : ''}" data-grp="">全部 <span class="n">${list.length}</span></button>` +
      groups.map(g => {
        const cnt = list.filter(x => x.grp === g).length;
        return cnt ? `<button type="button" class="fchip${state.motionGroup === g ? ' on' : ''}" data-grp="${esc(g)}">${esc(g)} <span class="n">${cnt}</span></button>` : '';
      }).join('');
    mob.querySelectorAll('.fchip').forEach(btn => {
      btn.onclick = () => { state.motionGroup = btn.dataset.grp; state.motionSub = ''; renderMotionsTab(); };
    });

    $('sjChipBar').style.display = 'none';

    const q = state.motionQuery.toLowerCase();
    const filtered = list.filter(t => {
      if (state.motionGroup && t.grp !== state.motionGroup) return false;
      if (state.motionSub && t.sub !== state.motionSub) return false;
      if (q && !`#${t.no} ${t.name} ${t.en} ${t.desc} ${t.example} ${t.grp} ${t.sub}`.toLowerCase().includes(q)) return false;
      return true;
    });
    lastFiltered = filtered;
    syncTopToolbar('搜索 #编号、动效中文名、英文或说明…', state.motionQuery, !!(state.motionGroup || state.motionSub || state.motionQuery), filtered.length, list.length);

    const content = $('sjContent');
    if (!filtered.length) {
      content.innerHTML = '<div class="sj-empty">没有符合条件的动效，试试切换左侧分类或清空搜索词。</div>';
      return;
    }

    const activeCanvases = new Map();
    motionObs = new IntersectionObserver((entries) => {
      for (const ent of entries) {
        const cv = ent.target;
        if (ent.isIntersecting) {
          if (!cv._mpReady && !cv._mpLoading) {
            cv._mpLoading = true;
            const pid = cv.dataset.packId;
            const idx = Number(cv.dataset.cellIdx);
            loadMotionPack(pid).then((pack) => {
              cv._mpLoading = false;
              if (pack && pack.cells && typeof pack.cells[idx] === 'function') {
                cv.width = pack.width || 539;
                cv.height = pack.height || 208;
                cv._mpReady = {
                  ctx: cv.getContext('2d'),
                  draw: pack.cells[idx],
                  w: cv.width,
                  h: cv.height,
                  cycle: pack.cycle || 4.7,
                  painted: false
                };
                if (cv._inView) activeCanvases.set(cv, cv._mpReady);
              }
            });
          }
          cv._inView = true;
          if (cv._mpReady) activeCanvases.set(cv, cv._mpReady);
        } else {
          cv._inView = false;
          activeCanvases.delete(cv);
        }
      }
    }, { threshold: 0.08 });

    const t0 = performance.now();
    const tick = (now) => {
      if (state.tab !== 'motion') { stopObservers(); return; }
      const sec = (now - t0) / 1000;
      let drawn = 0;
      for (const [cv, item] of activeCanvases) {
        if (!cv.isConnected) { activeCanvases.delete(cv); continue; }
        if (drawn >= 24 && item.painted) continue;
        try {
          item.ctx.clearRect(0, 0, item.w, item.h);
          item.ctx.save();
          item.draw(item.ctx, item.w, item.h, sec % item.cycle);
          item.ctx.restore();
          item.painted = true;
          drawn++;
        } catch (e) {}
      }
      motionRaf = requestAnimationFrame(tick);
    };
    motionRaf = requestAnimationFrame(tick);

    content.innerHTML = '';
    const showGroups = state.motionGroup ? [state.motionGroup] : groups.filter(g => filtered.some(x => x.grp === g));
    for (const grp of showGroups) {
      const group = filtered.filter(x => x.grp === grp);
      const sec = document.createElement('section');
      sec.className = 'sj-sec';
      sec.innerHTML = `<div class="sj-sec-head"><h2>${esc(state.motionSub ? grp + ' · ' + state.motionSub : grp)}</h2><span>${group.length} 条 · 纯代码 Canvas 2D 实时动画，滚进屏幕自动播放</span></div><div class="wall-5"></div>`;
      const grid = sec.querySelector('.wall-5');
      for (const t of group) {
        const card = document.createElement('article');
        card.className = 'sj-card';
        card.innerHTML = `
          <div class="sj-thumb is-motion">
            <canvas width="539" height="208" data-pack-id="${esc(t.packId)}" data-cell-idx="${t.cellIdx}"></canvas>
            <span class="sj-badge-no">#${esc(t.no)}</span>
          </div>
          <div class="sj-body">
            <div class="sj-name">${esc(t.name)}</div>
            ${t.en ? `<div class="sj-en">${esc(t.en)}</div>` : ''}
            ${t.desc ? `<div class="sj-desc">${esc(t.desc)}</div>` : ''}
          </div>
          <div class="sj-foot">
            <span class="sj-tag">${esc(t.sub || t.grp)}</span>
          </div>
        `;
        const cv = card.querySelector('canvas');
        if (t.packId && t.cellIdx >= 0) motionObs.observe(cv);
        card.onclick = () => openMotionModal(t);
        grid.appendChild(card);
      }
      content.appendChild(sec);
    }
  }

  function openMotionModal(t) {
    if (modalRaf) { cancelAnimationFrame(modalRaf); modalRaf = 0; }
    const modal = $('sjModal');
    modal.innerHTML = `
      <div class="sj-modal-head">
        <h3>#${esc(t.no)} ${esc(t.name)}${t.en ? ` <small style="font-weight:500;color:var(--muted);font-size:13px">${esc(t.en)}</small>` : ''}</h3>
        <button class="sj-close" id="sjCloseBtn" aria-label="关闭">×</button>
      </div>
      <div class="sj-modal-media"><canvas id="sjModalCanvas" width="539" height="208"></canvas></div>
      <div class="sj-meta-row">
        <span class="sj-tag is-accent">${esc(t.grp)}</span>
        ${t.sub ? `<span class="sj-tag">${esc(t.sub)}</span>` : ''}
        <span class="sj-tag">编号 #${esc(t.no)}</span>
      </div>
      ${t.desc ? `<div class="sj-modal-desc">${esc(t.desc)}</div>` : ''}
      ${t.example ? `<div class="sj-modal-box"><b>提问示例：</b>${esc(t.example)}</div>` : ''}
      <div class="sj-modal-acts">
        <button class="btn pri" id="sjCopyBtn">复制动效术语</button>
        ${t.gid ? `<a class="btn" href="https://showheyohtaki.github.io/motion-prompt/#${encodeURIComponent(t.gid)}" target="_blank" rel="noopener noreferrer">官方演示 ↗</a>` : ''}
      </div>
    `;
    $('sjCloseBtn').onclick = closeModal;
    $('sjCopyBtn').onclick = () => {
      const txt = `动效参考：#${t.no} ${t.name}${t.en ? '（' + t.en + '）' : ''} — ${t.desc || ''}${t.example ? '\n示例：' + t.example : ''}`;
      copyText(txt, '已复制动效术语');
    };
    const mask = $('sjModalMask');
    mask.classList.add('is-open');
    mask.setAttribute('aria-hidden', 'false');

    const cv = $('sjModalCanvas');
    if (t.packId && t.cellIdx >= 0) {
      loadMotionPack(t.packId).then((pack) => {
        if (!pack || !pack.cells || typeof pack.cells[t.cellIdx] !== 'function') return;
        const W = pack.width || 539, H = pack.height || 208, cycle = pack.cycle || 4.7;
        cv.width = W; cv.height = H;
        const ctx = cv.getContext('2d');
        const drawFn = pack.cells[t.cellIdx];
        const t0 = performance.now();
        const loop = (now) => {
          if (!cv.isConnected || !$('sjModalMask').classList.contains('is-open')) return;
          try {
            ctx.clearRect(0, 0, W, H);
            ctx.save();
            drawFn(ctx, W, H, ((now - t0) / 1000) % cycle);
            ctx.restore();
          } catch (e) {}
          modalRaf = requestAnimationFrame(loop);
        };
        modalRaf = requestAnimationFrame(loop);
      });
    }
  }

  // 顶部搜索与工具按钮事件绑定
  let searchTimer = 0;
  $('sjSearch').addEventListener('input', (e) => {
    clearTimeout(searchTimer);
    const val = e.target.value.trim();
    searchTimer = setTimeout(() => {
      if (state.tab === 'style') { state.styleQuery = val; renderStylesTab(); }
      else if (state.tab === 'component') { state.compQuery = val; renderCompsTab(); }
      else { state.motionQuery = val; renderMotionsTab(); }
    }, 120);
  });

  $('toggleSideBtn').onclick = () => {
    state.sideCollapsed = !state.sideCollapsed;
    $('aSide').classList.toggle('is-collapsed', state.sideCollapsed);
    $('toggleSideBtn').classList.toggle('is-on', !state.sideCollapsed);
  };

  $('autoPlayBtn').onclick = () => {
    state.autoPlay = !state.autoPlay;
    renderCurrentTab();
  };

  $('randomBtn').onclick = () => {
    if (!lastFiltered.length) return;
    const item = lastFiltered[Math.floor(Math.random() * lastFiltered.length)];
    if (state.tab === 'style') openStyleModal(item);
    else if (state.tab === 'component') openCompModal(item);
    else openMotionModal(item);
  };

  $('clearFilterBtn').onclick = () => {
    if (state.tab === 'style') { state.styleCat = ''; state.styleQuery = ''; }
    else if (state.tab === 'component') { state.compCat = ''; state.compEnergy = ''; state.compQuery = ''; }
    else { state.motionGroup = ''; state.motionSub = ''; state.motionQuery = ''; }
    $('sjSearch').value = '';
    renderCurrentTab();
  };

  function renderCurrentTab() {
    if (state.tab === 'style') renderStylesTab();
    else if (state.tab === 'component') renderCompsTab();
    else renderMotionsTab();
  }

  function renderAll() {
    renderTabs();
    renderSkins();
    renderCurrentTab();
    syncBarHeight();
  }

  // 与全站顶栏白天/夜晚切换同步
  const themeObs = new MutationObserver(() => {
    const night = document.documentElement.getAttribute('data-theme') === 'night';
    if (night && state.skin !== 'C' && state.skin !== 'G') setSkin('C', false);
    else if (!night && (state.skin === 'C' || state.skin === 'G')) setSkin('A', false);
  });
  themeObs.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  (function initSkin() {
    const night = document.documentElement.getAttribute('data-theme') === 'night';
    let saved = '';
    try { saved = localStorage.getItem('guiji_shijue_skin') || ''; } catch (e) {}
    if (night) {
      setSkin((saved === 'C' || saved === 'G') ? saved : 'C', false);
    } else {
      setSkin((saved && saved !== 'C' && saved !== 'G') ? saved : 'A', false);
    }
  })();

  let openInitialModal = null;
  if (initialItem) {
    const lower = initialItem.toLowerCase();
    const hitStyle = (DATA.styles || []).find(s => String(s.id).toLowerCase() === lower);
    const hitComp = !hitStyle && (DATA.components || []).find(c => String(c.id).toLowerCase() === lower || String(c.name).toLowerCase() === lower);
    const hitMotion = !hitStyle && !hitComp && (DATA.motions || []).find(m => String(m.no) === initialItem.replace(/^#/, '') || String(m.gid) === initialItem.replace(/^#/, ''));
    if (hitStyle) { state.tab = 'style'; openInitialModal = () => openStyleModal(hitStyle); }
    else if (hitComp) { state.tab = 'component'; openInitialModal = () => openCompModal(hitComp); }
    else if (hitMotion) { state.tab = 'motion'; openInitialModal = () => openMotionModal(hitMotion); }
  }

  renderAll();
  if (openInitialModal) openInitialModal();
  // 访客人数 (UV) 与访问次数 (PV) 统一由全站 ../assets/site-nav.js?v=2 自动统计（含 guiji_ignore_self 判断）
})();
</script>
</body>
</html>
