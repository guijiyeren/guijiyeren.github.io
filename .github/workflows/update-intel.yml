name: Update intel public dashboard data

on:
  schedule:
    # 06:00 Asia/Shanghai (22:00 UTC previous day)
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: intel-public-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh NewsNow public boards
        run: python scripts/update_newsnow.py

      - name: Commit refreshed snapshot
        run: |
          git config user.name "guijiyeren-bot"
          git config user.email "guijiyeren-bot@users.noreply.github.com"
          git add intel/data/api/newsnow.json
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "chore(intel): refresh public NewsNow snapshot"
          git push
