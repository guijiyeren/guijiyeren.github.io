name: intel-live-update

on:
  schedule:
    # UTC 23:00 = Asia/Shanghai 07:00
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch public intel feeds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/update_live_intel.py
      - name: Commit live feed
        run: |
          git config user.name "guijiyeren-intel-bot"
          git config user.email "guijiyeren-intel-bot@users.noreply.github.com"
          git add intel/data/live.json
          if git diff --cached --quiet; then
            echo "no live feed changes"
            exit 0
          fi
          git commit -m "auto: intel live feed $(date -u +%F)"
          git push
