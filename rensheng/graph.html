<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#04060c;color:#e8eeff;

  #bg{position:fixed;inset:0;z-index:0;transition:background .5s ease}
  #host{position:fixed;inset:0;z-index:1}
  .bar{position:fixed;left:20px;top:16px;right:20px;z-index:10;display:flex;align-items:center;gap:12px}
  .bar a.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:inherit;
    border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:6px 12px;font-size:13px;
    background:rgba(12,18,32,.62);backdrop-filter:blur(8px)}
  .bar a.back:hover{border-color:#7fb2ff;color:#9cc4ff}
  .bar .t{font-weight:600;font-size:15px}
  .bar .t span{font-weight:400;font-size:12px;color:rgba(232,238,255,.55);margin-left:8px}
  .themes{margin-left:auto;display:flex;gap:6px}
  .sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;position:relative}
  .sw[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.18)}
  .sw span{position:absolute;left:50%;bottom:-20px;transform:translateX(-50%);font-size:11px;white-space:nowrap;
    color:rgba(255,255,255,.75);opacity:0;transition:opacity .15s}
  .sw:hover span{opacity:1}
  .hint{position:fixed;left:20px;bottom:16px;z-index:10;font-size:12px;color:rgba(232,238,255,.45)}
  #tip{position:fixed;z-index:20;pointer-events:none;padding:6px 10px;border-radius:9px;font-size:12.5px;opacity:0;
    background:rgba(8,12,24,.9);border:1px solid rgba(140,180,255,.3);transition:opacity .12s;line-height:1.5}
  #panel{position:fixed;right:20px;top:64px;width:330px;max-height:calc(100vh - 120px);z-index:12;display:none;
    background:rgba(10,14,26,.92);border:1px solid rgba(140,180,255,.22);border-radius:14px;padding:16px;
    backdrop-filter:blur(12px);box-shadow:0 20px 50px rgba(0,0,0,.4)}
  #panel h3{margin:0 0 2px;font-size:16px}
  #panel .c{font-size:12px;color:rgba(232,238,255,.55);margin-bottom:10px}
  #panel ol{margin:0;padding-left:20px;font-size:12.5px;line-height:1.7;color:rgba(232,238,255,.86);max-height:60vh;overflow:auto}
  #panel li{margin-bottom:6px}
  #panel li a{color:inherit;text-decoration:none;border-bottom:1px dashed rgba(140,180,255,.4)}
  #panel li a:hover{color:#9cc4ff}
  #panel .x{position:absolute;right:10px;top:8px;background:none;border:none;color:rgba(232,238,255,.6);font-size:16px;cursor:pointer}
  .lbl{position:fixed;z-index:5;pointer-events:none;white-space:nowrap;transform:translate(-50%,-50%);
    font-size:12px;text-shadow:0 0 6px rgba(0,0,0,.9),0 0 14px rgba(0,0,0,.7);transition:opacity .2s}
  .lbl.cat{font-size:14px;font-weight:600;letter-spacing:.04em}
  .lbl small{font-weight:400;opacity:.62;margin-left:5px;font-size:11px}
  #imgprev{position:fixed;left:0;top:0;z-index:30;width:min(46vw,520px);pointer-events:none;opacity:0;
    transition:opacity .14s ease;will-change:transform,opacity}
  #imgprev.on{opacity:1}
  #flare{position:fixed;left:0;top:0;width:0;height:0;pointer-events:none;z-index:4;opacity:0;will-change:transform,opacity}
  #flare>div{position:absolute;border-radius:50%;transform:translate(-50%,-50%)}
  #info-btn{margin-left:10px;width:20px;height:20px;border-radius:50%;border:1px solid rgba(140,190,255,.45);
    background:rgba(30,50,80,.6);color:#cfe4ff;font-size:12px;line-height:18px;text-align:center;
    cursor:pointer;padding:0;vertical-align:2px;transition:.2s}
  #info-btn:hover{background:rgba(60,110,180,.85);color:#fff}
  #info-panel{position:fixed;left:20px;top:56px;z-index:70;width:300px;padding:16px 18px 14px;border-radius:14px;
    background:rgba(8,14,26,.92);border:1px solid rgba(120,170,240,.22);backdrop-filter:blur(14px);

  #info-panel.on{display:block}

  #info-panel .ip-title span{display:block;font-size:11px;font-weight:400;color:rgba(170,200,255,.6);margin-top:3px;letter-spacing:.5px}
  #info-panel .ip-list{margin:0;padding-left:16px;color:rgba(210,226,255,.82)}
  #info-panel .ip-list b{color:#9fd0ff;font-weight:600}
  #info-panel .ip-actions{display:flex;gap:10px;margin-top:14px}
  #info-panel .ip-actions button{flex:1;padding:7px 0;border-radius:9px;cursor:pointer;
    background:rgba(40,70,120,.55);border:1px solid rgba(130,180,255,.25);color:#d6e4ff;font-size:12px}
  #info-panel .ip-actions button:hover{background:rgba(60,110,180,.8);color:#fff}
  #fps{position:fixed;left:20px;bottom:18px;z-index:80;padding:6px 10px;border-radius:8px;
    background:rgba(8,14,26,.8);border:1px solid rgba(120,170,240,.2);color:#9fd0ff;font-size:11px;
    font-family:ui-monospace,monospace;pointer-events:none}
  #fs-btn,#fs-exit{position:fixed;z-index:60;width:40px;height:40px;border-radius:11px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    background:rgba(12,20,36,.55);border:1px solid rgba(140,190,255,.22);color:#cfe4ff;
    font-size:15px;line-height:1;backdrop-filter:blur(8px);transition:.2s;opacity:.55}
  #fs-btn{right:18px;bottom:52px}
  #fs-btn:hover,#fs-exit:hover{opacity:1;background:rgba(40,70,120,.75);color:#fff}
  #fs-exit{right:18px;top:18px;display:none;border-radius:50%}
  html.fs-mode #fs-btn{display:none}
  html.fs-mode #fs-exit{display:flex}
  html.fs-mode .bar,html.fs-mode .hint{opacity:0;transition:opacity .3s;pointer-events:none}
  html.no-labels .lbl{opacity:0!important;transition:opacity .25s}
  #loading{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:18px;background:#04060e;transition:opacity .6s ease}
  #loading.off{opacity:0;pointer-events:none}
  #loading .ld-ring{width:46px;height:46px;border-radius:50%;border:2px solid rgba(140,190,255,.18);
    border-top-color:#8fd0ff;animation:ldspin 1s linear infinite}
  #loading .ld-txt{font-size:13px;letter-spacing:2px;color:rgba(190,215,255,.75)}
  @keyframes ldspin{to{transform:rotate(360deg)}}
  #imgprev img{display:block;width:100%;height:auto;border-radius:10px;background:#fff;
    box-shadow:0 22px 54px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.14)}
  body.theme-glass .lbl{color:#1b2634;text-shadow:0 0 6px rgba(255,255,255,.95),0 0 14px rgba(255,255,255,.9)}
  body.theme-glass .hint{color:rgba(20,30,46,.5)}
  body.theme-glass .bar a.back{background:rgba(255,255,255,.75);border-color:rgba(20,30,46,.14)}
  body.theme-glass #tip{background:rgba(255,255,255,.95);color:#16202e;border-color:rgba(20,30,46,.12)}
  body.theme-glass #panel{background:rgba(255,255,255,.94);color:#16202e;border-color:rgba(20,30,46,.12)}
  body.theme-glass #panel ol{color:rgba(20,30,46,.85)}

":"risk","tags":[]},{"id":"1-37","t":"赌到借钱还赌、心情一直低落时，先打 12356，再把银行卡和支付密码交给家人管","s":"1","cat":"family","tags":["relation","mind","privacy"]},{"id":"1-38","t":"有高危性行为的男男性行为者，去艾滋病定点医院问暴露前预防药，按时吃能少感染约七成","s":"1","cat":"health","tags":["doctor"]},{"id":"1-39","t":"65 岁以上的女性去做一次双能 X 线骨密度检查，绝经后有骨质疏松危险因素的不用等到 65 岁","s":"1","cat":"health","tags":["checkup"]},{"id":"1-40","t":"查出骨质疏松，或者轻轻一摔就骨折过，就请医生开抗骨质疏松药并坚持用，别拿补钙代替","s":"1","cat":"health","tags":["doctor","habit","medicine"]},{"id":"1-41","t":"上野外冰面前先打孔量厚度，不到 15 厘米别上，河上的冰和冰钓洞边别去","s":"1","cat":"risk","tags":[]},{"id":"1-42","t":"装好护罩、戴上护目镜加面屏再用角磨机，双手握稳，别装木工锯片切木头","s":"1","cat":"risk","tags":[]},{"id":"1-43","t":"直接问身边情绪不对的人「你有没有想过自杀」，问了不会让他更想","s":"1","cat":"health","tags":["mind"]},{"id":"1-44","t":"心慌、心跳乱就去做心电图，查出房颤请医生评估吃抗凝药防中风，别拿阿司匹林代替","s":"1","cat":"health","tags":["doctor"]},{"id":"1-45","t":"成年人查一次丙肝抗体，阳性就再查核酸，确诊了吃 8 到 12 周口服药，绝大多数能治好","s":"1","cat":"risk","tags":[]},{"id":"1-46","t":"下化粪池、窨井、污水池、菜窖地窖、发酵罐等有限空间前，先通风、检测合格、落实防护和监护，条件不够不进入。有人倒下别跟着下去，打 119 和 120","s":"1","cat":"family","tags":["elder","emergency"]},{"id":"1-47","t":"45 岁以上，住在胃癌食管癌高发地区、有家族史或幽门螺杆菌阳性的，去做胃镜筛查","s":"1","cat":"health","tags":["checkup"]},{"id":"1-48","t":"泡发的木耳、银耳当顿吃完别过夜，河粉、肠粉这类湿米粉买来当天吃，家里不自制酵米面","s":"1","cat":"risk","tags":[]},{"id":"2-1","t":"戒烟，越早越好","s":"2","cat":"health","tags":["smoke","doctor"]},{"id":"2-2","t":"别在家里和车里抽烟，也别让客人在家里抽","s":"2","cat":"health","tags":["smoke","kids"]},{"id":"2-3","t":"戒烟别光靠忍，先去拿药：吃伐尼克兰的成功率能翻一倍多","s":"2","cat":"health","tags":["smoke","doctor"]},{"id":"2-4","t":"定一个戒烟日，到那天一次停掉，别先慢慢减","s":"2","cat":"health","tags":["smoke"]},{"id":"2-5","t":"去戒烟门诊，或者打 12320 问当地有没有戒烟服务","s":"2","cat":"health","tags":["doctor","smoke"]},{"id":"2-6","t":"已经戒不掉再考虑电子烟，本来不吸烟的人别碰","s":"2","cat":"health","tags":["smoke"]},{"id":"2-7","t":"不喝含糖饮料，换成无糖的也不算解决","s":"2","cat":"health","tags":["diet"]},{"id":"2-8","t":"不嚼槟榔","s":"2","cat":"health","tags":[]},{"id":"2-9","t":"把家里的食盐换成低钠盐（钾盐）","s":"2","cat":"health","tags":[]},{"id":"2-10","t":"认真刷牙，每天清一次牙缝，缺了牙去看牙医","s":"2","cat":"health","tags":["teeth"]},{"id":"2-11","t":"每天走到 7000–8000 步，或者每周累计快走 150–300 分钟","s":"2","cat":"health","tags":[]},{"id":"2-12","t":"成年后定期查血脂，40 岁前每 2 到 5 年一次、40 岁起每年一次；有高血压、高血脂就按医嘱规律吃药，别自行停","s":"2","cat":"health","tags":["checkup","medicine"]},{"id":"2-13","t":"每晚睡 7 小时左右，作息固定","s":"2","cat":"health","tags":["sleep"]},{"id":"2-14","t":"常打网球、羽毛球、乒乓球这类球拍类运动","s":"2","cat":"health","tags":["sport"]},{"id":"2-15","t":"把爬楼梯、快走赶路这类零碎的用力活动攒到每天四五分钟","s":"2","cat":"health","tags":["sport"]},{"id":"2-16","t":"每周做 30–60 分钟力量训练","s":"2","cat":"health","tags":["sport"]},{"id":"2-17","t":"别连着坐太久，隔一阵起身动一动","s":"2","cat":"health","tags":[]},{"id":"2-18","t":"少吃加工肉（火腿、培根、香肠、午餐肉）","s":"2","cat":"health","tags":[]},{"id":"2-19","t":"少喝或不喝酒","s":"2","cat":"health","tags":["smoke"]},{"id":"2-20","t":"每天都喝酒、一停就手抖心慌的人，别自己硬戒","s":"2","cat":"health","tags":["smoke","medicine"]},{"id":"2-21","t":"想少喝酒，先把一周喝了多少数出来，再找医生聊几分钟","s":"2","cat":"health","tags":["doctor","smoke"]},{"id":"2-22","t":"每天吃一小把坚果","s":"2","cat":"health","tags":[]},{"id":"2-23","t":"把一部分红肉换成鱼和禽肉","s":"2","cat":"health","tags":["diet"]},{"id":"2-24","t":"把一部分精米白面换成全谷物","s":"2","cat":"health","tags":[]},{"id":"2-25","t":"每周喝三次以上茶","s":"2","cat":"health","tags":[]},{"id":"2-26","t":"每天喝三到四杯咖啡，咖啡因总量不超过 400 mg，不加糖不加奶盖","s":"2","cat":"health","tags":[]},{"id":"2-27","t":"每天吃够 5 份（约 400 g）水果蔬菜","s":"2","cat":"health","tags":["diet"]},{"id":"2-28","t":"少吃超加工食品（薯片、方便面、糕点、速食）","s":"2","cat":"health","tags":[]},{"id":"2-29","t":"做饭、取暖不烧煤和柴，换成电或燃气","s":"2","cat":"safety","tags":["fire"]},{"id":"2-30","t":"热的东西放一放再喝，不喝滚烫的茶、汤和咖啡","s":"2","cat":"health","tags":["smoke"]},{"id":"2-31","t":"白天出门晒晒太阳，别整天不见光","s":"2","cat":"health","tags":[]},{"id":"2-32","t":"把 BMI 控制在 20–25，超重就减","s":"2","cat":"health","tags":["weight"]},{"id":"2-33","t":"每周吃四次以上辣椒","s":"2","cat":"health","tags":[]},{"id":"2-34","t":"每天喝一两份奶或酸奶","s":"2","cat":"health","tags":[]},{"id":"2-35","t":"鸡蛋不用戒，一天一个以内就行","s":"2","cat":"health","tags":[]},{"id":"2-36","t":"有条件就泡澡，别只冲淋浴","s":"2","cat":"health","tags":[]},{"id":"2-37","t":"把午睡控制在半小时内，别超过一小时，非得睡一两小时才撑得住就去查原因","s":"2","cat":"health","tags":["sleep","weight"]},{"id":"2-38","t":"熬夜之后第二天晚上就补觉，别攒到周末","s":"2","cat":"health","tags":["sleep"]},{"id":"2-39","t":"上夜班干得越久心血管风险越高，能转岗就趁早转","s":"2","cat":"health","tags":[]},{"id":"2-40","t":"买预包装、有 SC 编号的食用油，不买小作坊散装自榨花生油","s":"2","cat":"health","tags":[]},{"id":"2-41","t":"做饭用植物油代替猪油和黄油，不必为了健康换着买油，也别指望亚麻籽油护心","s":"2","cat":"health","tags":[]},{"id":"2-42","t":"炒菜、煎炸时打开抽油烟机，从开火一直开到做完","s":"2","cat":"health","tags":[]},{"id":"2-43","t":"绝经前后潮热盗汗影响到生活，就去妇科评估激素治疗，别硬扛也别自己买药，更别拿它防心脏病","s":"2","cat":"health","tags":["doctor"]},{"id":"2-44","t":"本来就想养狗的，把每天遛狗算进走路量，别为了长寿专门去养狗","s":"2","cat":"life","tags":["pet","sport"]},{"id":"2-45","t":"查出糖尿病前期（血糖偏高、还没到糖尿病），就靠少吃、减重、多动把糖尿病往后推，每半年复查一次血糖","s":"2","cat":"health","tags":["weight","checkup","habit"]},{"id":"2-46","t":"家里的花生、玉米、坚果和米面发了霉，整包扔掉，别挑掉霉的吃剩下的；嚼到发苦的坚果马上吐掉","s":"2","cat":"health","tags":["smoke","vaccine"]},{"id":"2-47","t":"别吃淡水鱼虾做的鱼生、生鱼片、鱼生粥和醉虾，常吃过的去医院查一次肝吸虫，查出来按医嘱吃吡喹酮","s":"2","cat":"health","tags":["doctor"]},{"id":"3-1","t":"关掉非必要通知，工作时把手机放到视线之外","s":"3","cat":"growth","tags":["focus","digital"]},{"id":"3-2","t":"固定起床时间，周末也一样","s":"3","cat":"growth","tags":["time","sleep"]},{"id":"3-3","t":"每晚睡够 7 到 8 小时，别把 6 小时当作够用","s":"3","cat":"health","tags":["sleep"]},{"id":"3-4","t":"下午两点以后不碰咖啡因","s":"3","cat":"health","tags":["sleep","time"]},{"id":"3-5","t":"把邮件和消息改成每天固定几次批量处理","s":"3","cat":"health","tags":[]},{"id":"3-6","t":"做需要连续思考的工作时，把哪怕几秒钟的打断也挡在外面","s":"3","cat":"health","tags":[]},{"id":"3-7","t":"一次只做一件事，不要边开会边回消息","s":"3","cat":"health","tags":[]},{"id":"3-8","t":"睡前一小时不看发光屏幕，要看就看纸书或不开屏幕灯的墨水屏","s":"3","cat":"health","tags":[]},{"id":"3-9","t":"到点就睡，不为游戏、短视频、色情内容熬夜","s":"3","cat":"health","tags":["sleep","focus","kids"]},{"id":"3-10","t":"深夜不做重大决定、不发要紧的消息","s":"3","cat":"health","tags":[]},{"id":"3-11","t":"下午困了就睡 10 分钟，不要睡半小时","s":"3","cat":"health","tags":["sleep"]},{"id":"3-12","t":"在开放式办公室工作时用耳塞或找安静房间做需要记忆的活","s":"3","cat":"growth","tags":["learn","time"]},{"id":"3-13","t":"别把每周工作时间一味往上加：过了 49 小时上下，多干一小时多出的活越来越少","s":"3","cat":"growth","tags":["time"]},{"id":"3-14","t":"发现自己在反复回想同一件糟心事时，换个需要动手的活","s":"3","cat":"health","tags":["mind"]},{"id":"3-15","t":"把「事情肯定会更糟」这类念头当症状看，不当事实看","s":"3","cat":"health","tags":[]},{"id":"3-16","t":"减少让你消耗的人际关系，学会拒绝不想接的请求","s":"3","cat":"health","tags":[]},{"id":"3-17","t":"生气时先离场，把对方当天气而不是当敌人","s":"3","cat":"health","tags":[]},{"id":"3-18","t":"情绪低落时先做性价比最高的几件事：动起来、多见光、按时睡、找人说、打 12356","s":"3","cat":"health","tags":["mind","sport"]},{"id":"3-19","t":"把警察、医生、柜员当成按规则上班的人，别当成角色：能推动事情的是文书和期限，不是情绪","s":"3","cat":"health","tags":["doctor","mind","law"]},{"id":"3-20","t":"别把「别人过得怎么样」当每日必读：给刷同龄人动态的应用设限或关掉","s":"3","cat":"health","tags":["mind"]},{"id":"3-21","t":"觉得「所有人都看见我出丑了」的时候，把这个估计除以二","s":"3","cat":"health","tags":[]},{"id":"3-22","t":"把「别人要求我做到完美」当症状看，不当事实看","s":"3","cat":"health","tags":[]},{"id":"3-23","t":"生气时别靠打沙袋、跑一圈来发泄，先让身体慢下来","s":"3","cat":"health","tags":["mind"]},{"id":"3-24","t":"心里压着一件事，可以连着几天把想法和感受写下来，但别指望它治病","s":"3","cat":"health","tags":["mind"]},{"id":"3-25","t":"痛经就吃布洛芬这类止痛药，别硬扛；痛到耽误上班上学、吃三个月药也压不住，就去妇科查","s":"3","cat":"health","tags":["medicine","doctor","time"]},{"id":"3-26","t":"长期失眠（一周三晚以上、拖了三个月以上）先做失眠的认知行为治疗，别一上来就长期吃安眠药","s":"3","cat":"health","tags":["sleep","doctor","time"]},{"id":"3-27","t":"打鼾很响、有人看见你睡着时憋气、白天困到开车都想睡的，去医院做睡眠监测查睡眠呼吸暂停，中重度的夜里戴呼吸机","s":"3","cat":"health","tags":["sleep","doctor","traffic"]},{"id":"4-1","t":"把「打算做」写成「几点、在哪、遇到什么就做什么」","s":"4","cat":"growth","tags":["habit"]},{"id":"4-2","t":"开工前写下退出条件","s":"4","cat":"growth","tags":[]},{"id":"4-3","t":"决定是否继续时，只看未来投入和未来回报，不看已投入多少","s":"4","cat":"money","tags":["save"]},{"id":"4-4","t":"估工期时按过去同类任务的实际耗时估，不按计划推","s":"4","cat":"growth","tags":["habit"]},{"id":"4-5","t":"会前发议程，没议程的会不开；能站着开就站着开","s":"4","cat":"growth","tags":[]},{"id":"4-6","t":"砍会议数量，能用文字异步解决的不开会","s":"4","cat":"growth","tags":["ti ","s":"8","cat":"life","tags":["home","rent"]},{"id":"8-28","t":"别当「挂名法人」，别把身份证借给人注册公司","s":"8","cat":"work","tags":["legalentity"]},{"id":"8-29","t":"出入境不帮陌生人带东西，不代收来路不明的包裹","s":"8","cat":"safety","tags":["scam"]},{"id":"8-30","t":"养狗必须牵绳：不牵绳出了事是无过错责任（你有没有错都要赔），赔到底。狗还要按时打狂犬病疫苗、办养犬登记","s":"8","cat":"life","tags":["pet","vaccine","income"]},{"id":"8-31","t":"对方喝到意识不清、睡着，或者可能不满 14 岁，就不要发生关系","s":"8","cat":"safety","tags":[]},{"id":"8-32","t":"发生关系、裸聊之后对方拿报警、发照片、告诉你单位来要钱，一分钱不给，一条记录不删，直接报警","s":"8","cat":"life","tags":["digital","law","privacy"]},{"id":"8-33","t":"被人捏造事实举报，可以要求追究：够治安处罚的拘留 5 日起，够罪的判 3 年以下","s":"8","cat":"safety","tags":["crime"]},{"id":"8-34","t":"证据不足本来就应当判无罪，逼出来的口供应当排除；判了还有申诉和再审","s":"8","cat":"safety","tags":["law"]},{"id":"8-35","t":"被羁押后撤案、不起诉或者判无罪的，去申请国家赔偿，按天算钱","s":"8","cat":"safety","tags":["law","income","crime"]},{"id":"8-36","t":"自己是受害人去索赔，走 12315、起诉或者律师，别单独赴对方的约，别把「给钱」和「我不曝光」绑成一句话","s":"8","cat":"safety","tags":["law","contract"]},{"id":"8-37","t":"被网暴了：先开防护、先固证，再在平台、禁令、报警三条路里挑","s":"8","cat":"safety","tags":["law"]},{"id":"8-38","t":"「先给人买保险再动手」这条路法律上从头堵死：钱一分拿不到，罪按故意杀人加保险诈骗数罪并罚","s":"8","cat":"money","tags":["insurance","scam","crime"]},{"id":"8-39","t":"报警当场要受案回执，不立案要书面通知：7 日内可申请复议，再 7 日可申请复核，检察院能通知公安立案","s":"8","cat":"safety","tags":["contract","law","focus"]},{"id":"8-40","t":"别给办案、执法的人送钱送卡：行贿自己也判，对监察、执法、司法人员行贿还要从重","s":"8","cat":"safety","tags":[]},{"id":"8-41","t":"可能翻脸的电话和面谈，直接开录音：自己参加的谈话，不用先征得对方同意","s":"8","cat":"safety","tags":["law","income"]},{"id":"8-42","t":"现场出了事，先拍全景，再拍位置关系，最后拍损坏和伤情，原图原视频别删","s":"8","cat":"safety","tags":["law","digital"]},{"id":"8-43","t":"被家暴了：先报警留下出警记录，再去法院申请人身安全保护令，不用先离婚，也不收费","s":"8","cat":"safety","tags":["law","marriage","crime"]},{"id":"8-44","t":"家里人赌博欠了债，别急着替他还：赌债法律不保护，为赌借的钱也不算夫妻共同债务","s":"8","cat":"safety","tags":["law","crime","relation"]},{"id":"8-45","t":"熟人让你「帮忙刷个脸、做个见证」去办贷款，或者要你念验证码，别答应：这叫 AB 贷，借款人是你，不是担保人","s":"8","cat":"money","tags":["debt","scam","law"]},{"id":"8-46","t":"给门窗装好锁、门外装一盏感应灯，出门真的锁上：防入室盗窃靠这几样，单装一个报警器看不出用","s":"8","cat":"safety","tags":["law"]},{"id":"9-1","t":"群里不转发不知真假的灾情、疫情、警情消息，不 P 图、不用 AI 造现场图","s":"9","cat":"safety","tags":[]},{"id":"9-2","t":"不发、不转侮辱英烈的图片、表情包和评论，不拿国旗国歌开玩笑","s":"9","cat":"safety","tags":["law","crime"]},{"id":"9-3","t":"境外网站上的东西看完就关，不截图、不转发、不搬进群里，也不在评论区跟着说","s":"9","cat":"safety","tags":["crime"]},{"id":"9-4","t":"黄色视频自己看归自己，别往群里发、别卖「资源」、别建群","s":"9","cat":"safety","tags":["crime"]},{"id":"9-5","t":"「兼职」要你用自己的卡收钱、取现、转账，不管给多少好处费都不做","s":"9","cat":"safety","tags":["scam","crime"]},{"id":"9-6","t":"有人拉你去「包装材料」贷款、按贷款额分你好处费，一个都不做","s":"9","cat":"money","tags":["debt","crime"]},{"id":"9-7","t":"捡到银行卡不取钱，捡到手机、钱包联系失主或交给警察，不揣走","s":"9","cat":"life","tags":["digital","debt","scam"]},{"id":"9-8","t":"优惠用自己的真实身份领，不买虚拟号批量注册小号，不靠漏洞重复领","s":"9","cat":"money","tags":["save","crime","legalentity"]},{"id":"9-9","t":"阳台、窗户不往外扔任何东西，烟头、垃圾袋、酒瓶都算","s":"9","cat":"safety","tags":["crime"]},{"id":"9-10","t":"不网购仿真枪、钢珠枪、气枪，不买来路不明的「玩具枪」","s":"9","cat":"safety","tags":["law"]},{"id":"9-11","t":"买了无人机先实名登记，机场、军事区和城市管制空域不飞，不破解限高","s":"9","cat":"safety","tags":[]},{"id":"9-12","t":"不偷拍别人，不在出租屋、民宿、酒店房间装摄像头","s":"9","cat":"safety","tags":[]},{"id":"9-13","t":"麻将、扑克可以打，不抽头、不当庄、不组局收钱，不玩网络赌博","s":"9","cat":"safety","tags":["crime"]},{"id":"9-14","t":"不吃野味，不买卖、不养保护动物当宠物，野兰花、崖柏、红豆杉也别挖别买卖","s":"9","cat":"life","tags":["pet"]},{"id":"9-15","t":"要债不扣人、不关人、不跟到家里赖着不让走","s":"9","cat":"safety","tags":["law","crime"]},{"id":"9-16","t":"身份证不借人，不用别人的身份证，也不拿别人的证件登记、开卡、买票","s":"9","cat":"safety","tags":["crime"]},{"id":"9-17","t":"被警察拦下或带走时配合，不推、不打、不抢执法记录仪，喝了酒更要忍","s":"9","cat":"safety","tags":["law"]},{"id":"9-18","t":"对方不满 14 岁就不能发生关系，「她同意」不是理由","s":"9","cat":"safety","tags":[]},{"id":"9-19","t":"动手打人前算清这笔账：拘留、赔钱、判刑","s":"9","cat":"safety","tags":["crime","income","law"]},{"id":"9-20","t":"孩子生下来养不了，只有民政登记这一条合法出路：收钱把孩子给人可能按拐卖罪判，扔下不管是遗弃罪","s":"9","cat":"family","tags":["kids","doctor","elder"]},{"id":"9-21","t":"别伪造事故、别夸大损失骗理赔：这是保险诈骗罪，帮你作证、帮你修车、帮你鉴定的人一起算","s":"9","cat":"money","tags":["insurance","scam","crime"]},{"id":"9-22","t":"不卖自己的器官，也别帮人找供体：肾到手 2 万多，同一枚转手卖 20 万，钱要被没收还要按交易额罚 10 到 20 倍","s":"9","cat":"safety","tags":[]},{"id":"9-23","t":"别嫖娼：默认档是拘留 10 到 15 日，不是罚点钱了事","s":"9","cat":"safety","tags":["crime"]},{"id":"9-24","t":"汉化漫画、搬运影视剧、分享网盘资源和盗版电子书，不收钱也是侵权；挂广告、收会员费就可能判刑","s":"9","cat":"money","tags":["spend","crime","income"]},{"id":"9-25","t":"写同人、做二创拿去出版或卖钱，先取得原作许可，或者把借来的人物名字和关系换成自己的","s":"9","cat":"safety","tags":["law","school"]},{"id":"9-26","t":"别为了防身买甩棍、电击器、匕首、辣椒水带在身上，放在车里也算携带","s":"9","cat":"safety","tags":[]},{"id":"9-27","t":"捕鱼、钓鱼时，禁渔期和禁渔区不下网，任何时候都不电鱼、毒鱼、炸鱼，不用禁用渔具","s":"9","cat":"safety","tags":["scam"]},{"id":"9-28","t":"上坟、烧荒、野炊时不在林区和草原点火，看到山火打 12119 或 119","s":"9","cat":"safety","tags":["fire","law"]},{"id":"9-29","t":"考公、考研、考驾照和考职业资格时，不替人考、不找人替考，不买卖答案，不帮人组织作弊","s":"9","cat":"family","tags":["school"]},{"id":"10-1","t":"认识更多人，而不是死磕一个：两个人合不合得来，见面之前预测不出来","s":"10","cat":"family","tags":[]},{"id":"10-2","t":"对方明确拒绝之后就停下，继续纠缠是治安违法，不是「诚意」","s":"10","cat":"family","tags":[]},{"id":"10-3","t":"判断对方有没有兴趣，看行为不看「信号」：谁主动、谁安排、谁跟进","s":"10","cat":"growth","tags":["time"]},{"id":"10-4","t":"关系好不好，主要看你自己在这段关系里的感受，不是看对方条件","s":"10","cat":"health","tags":["mind"]},{"id":"10-5","t":"想拉近距离就轮流回答一组由浅入深的问题，别学话术","s":"10","cat":"family","tags":[]},{"id":"10-6","t":"异地恋不比同城差，真正的坎是搬到一起之后的头三个月","s":"10","cat":"family","tags":["marriage","time"]},{"id":"10-7","t":"先看登记数据再听长辈：结婚率、离婚率各是什么口径","s":"10","cat":"family","tags":["marriage"]},{"id":"10-8","t":"把结婚的健康收益算进去，但按观察性数据打折","s":"10","cat":"family","tags":["marriage"]},{"id":"10-9","t":"时间账按「无酬劳动」算，谈清分工再领证","s":"10","cat":"growth","tags":["time","marriage"]},{"id":"10-10","t":"结婚的钱账先看法律默认规则，再决定要不要书面约定","s":"10","cat":"family","tags":["marriage","contract","income"]},{"id":"10-11","t":"父母出资买房，在转账的时候就把是借是送写清楚","s":"10","cat":"safety","tags":["scam","rent","elder"]},{"id":"10-12","t":"配偶一方大额借的钱，你没签字也没追认，不自动变成你的债","s":"10","cat":"safety","tags":["law","relation"]},{"id":"10-13","t":"领证只要身份证加一份签字声明，不用户口簿，不收钱，当场发证","s":"10","cat":"family","tags":["marriage"]},{"id":"10-14","t":"婚前做一次婚检，有重大疾病必须在登记前如实告诉对方","s":"10","cat":"family","tags":["marriage"]},{"id":"10-15","t":"算退出成本：协议离婚有 30 天冷静期，诉讼离婚有法定条件","s":"10","cat":"safety","tags":["law","marriage","contract"]},{"id":"10-16","t":"给「为长辈结婚」单独记一笔账，别和自己的账混在一起","s":"10","cat":"family","tags":["marriage"]},{"id":"10-17","t":"把关系好坏当成一笔健康账：吵架对事不对人，别骂人、别挖苦","s":"10","cat":"family","tags":["marriage","relation"]},{"id":"10-18","t":"同性伴侣趁两个人都清醒，办好授权委托、意定监护和遗嘱：法律上你们不是近亲属，不办就没有签字权和继承权","s":"10","cat":"family","tags":["elder","doctor","contract"]},{"id":"10-19","t":"别靠隐瞒性取向结婚，也别把形婚当成省事的办法：法律上它就是一段真婚姻，想退出只能走离婚","s":"10","cat":"family","tags":["marriage","income","law"]},{"id":"10-20","t":"关系卡在反复吵架和冷战里，两个人一起去做伴侣治疗：干等着基本不会自己好","s":"10","cat":"family","tags":[]},{"id":"10-21","t":"办了婚礼、摆了酒席，也要去领结婚证：没登记的在法律上不算夫妻，对方去世你没有配偶的继承权","s":"10","cat":"family","tags":["marriage","relation","law"]},{"id":"10-22","t":"配偶背着你拿夫妻共同的钱大额打赏主播、转给婚外的人：不离婚也能请求分割共同财产，转给婚外的人的钱可以起诉要回","s":"10","cat":"safety","tags":["law","spend","marriage"]},{"id":"10-23","t":"有未成年孩子的夫妻离婚时，把孩子跟谁、每月抚养费多少、探望的方式和时间都写进离婚协议：写得越具体，离婚后越少再打官司","s":"10","cat":"safety","tags":["contract","law","kids"]},{"id":"11-1","t":"动手前先问一句：厂商、平台、公司会不会去报案；被追究后马上找刑事律师","s":"11","cat":"safety","tags":["law","crime"]},{"id":"11-2","t":"不做、不卖游戏外挂和辅助，包括「只读屏幕不碰内存」的 AI 辅助，也不卖给微信这类软件加功能的改版","s":"11","cat":"safety","tags":["crime"]},{"id":"11-3","t":"不写、不卖抢票、秒杀、刷单、薅羊毛脚本，哪怕只是「自动化点按钮」","s":"11","cat":"safety","tags":["scam"]},{"id":"11-4","t":"爬虫只爬无需登录的公开页面，不绕反爬、不碰个人信息，爬到的数据不卖","s":"11","cat":"safety","tags":["crime","digital"]},{"id":"11-5","t":"不接赌博、诈骗、色情 App 的开发单，不替「客户」搭支付通道、解封账号","s":"11","cat":"safety","tags":["crime","scam"]},{"id":"11-6","t":"离职时交清账号权限，不删库、不留后门、不改密码锁系统，哪怕公司欠你钱","s":"11","cat":"safety","tags":["privacy","office","law"]},{"id":"11-7","t":"离职不带走源码、客户名单和技术文档，不上传个人网盘，不在下家复用","s":"11","cat":"work","tags":["office"]},{"id":"11-8","t":"不在别人的电脑、服务器、摄像头上跑自己的程序，公司机器不拿来挖矿","s":"11","cat":"life","tags":["digital","crime"]},{"id":"11-9","t":"没有书面授权不测别人的系统，「出于好意」和「事后上报」在法条里都不是出罪理由","s":"11","cat":"safety","tags":["contract","privacy"]},{"id":"11-10","t":"漏洞按规定报送，修补前不公开细节、不发利用工具、不交给境外","s":"11","cat":"work","tags":["legalentity"]},{"id":"11-11","t":"不卖翻墙工具、VPN 账号，不替人搭这类节点","s":"11","cat":"safety","tags":["privacy"]},{"id":"11-12","t":"签了竞业协议，离职后公司不按月给补偿就书面催告，满 3 个月没给可以解除；没接触过商业秘密的岗位可请求确认条款不生效","s":"11","cat":"safety","tags":["contract","office","law"]},{"id":"11-13","t":"上班时间、用公司资源写的代码归公司，自己的开源项目用自己的时间和设备做，不混公司代码","s":"11","cat":"growth","tags":["time","contract"]},{"id":"11-14","t":"用 GPL 等开源代码做产品，按许可证要求开源或换许可证，不当「没人管」","s":"11","cat":"work","tags":["legalentity","contract"]},{"id":"11-15","t":"做 App 只收业务必需的个人信息，14 岁以下要监护人同意，隐私政策写清楚","s":"11","cat":"safety","tags":["privacy","elder"]},{"id":"11-16","t":"网站、App 上线前先做 ICP 备案，按等级保护要求留 6 个月以上日志","s":"11","cat":"work","tags":["legalentity"]},{"id":"11-17","t":"对公众提供生成式 AI 服务前先按规定做安全评估和算法备案，生成内容加标识","s":"11","cat":"work","tags":["legalentity"]},{"id":"11-18","t":"不做、不发自动跳过或屏蔽别家 App 广告的工具，免费也可能被判不正当竞争","s":"11","cat":"money","tags":["save","law"]},{"id":"11-19","t":"不搭「AI 中转站」低价转卖境外大模型接口：上海已有站长被刑事拘留","s":"11","cat":"safety","tags":["crime","legalentity"]},{"id":"11-20","t":"不写、不卖、不传软件的破解补丁、注册机和破解版，卖钱够了数就按侵犯著作权罪判","s":"11","cat":"work","tags":["legalentity","income"]},{"id":"11-21","t":"不帮人发起 DDoS 流量攻击，不卖、不租「压力测试」打流量平台，打游戏输了也别去打对方的服务器","s":"11","cat":"health","tags":["mind","law","crime"]},{"id":"12-1","t":"只拿亏得起的钱创业，不动家底、不借钱开张","s":"12","cat":"work","tags":["startup","relation","legalentity"]},{"id":"12-2","t":"不给公司贷款签个人担保，配偶更不要跟着签","s":"12","cat":"money","tags":["debt","law","startup"]},{"id":"12-3","t":"开张前选对主体：个体户和合伙人赔到底，有限公司才「有限」","s":"12","cat":"work","tags":["legalentity","startup"]},{"id":"12-4","t":"不当挂名股东，不替人代持股权","s":"12","cat":"work","tags":[]},{"id":"12-5","t":"加盟前先查商务部备案，拿到书面披露，把「冷静期」写进合同","s":"12","cat":"safety","tags":["contract","legalentity","startup"]},{"id":"12-6","t":"注册前把名称、经营场所、经营范围和注册资本定下来，材料齐了当场就能领执照","s":"12","cat":"work","tags":["legalentity"]},{"id":"12-7","t":"要许可证的行当，证没下来不开张","s":"12","cat":"work","tags":["legalentity"]},{"id":"12-8","t":"做食品先看自己落在哪一档：生产和做餐饮要许可，只卖预包装的改备案，卖生鲜肉菜不用证","s":"12","cat":"work","tags":["legalentity"]},{"id":"12-9","t":"卖预包装食品先核对标签：生产日期、保质期、配料表按规定标齐","s":"12","cat":"work","tags":[]},{"id":"12-10","t":"普通食品不许说能治病：标签、说明书、广告和直播话术都算","s":"12","cat":"work","tags":["ecom","legalentity"]},{"id":"12-11","t":"食品这一行有刑事线：卖病死肉、超标货就够罪，掺了有毒有害的不看金额、起刑五年以下","s":"12","cat":"work","tags":[]},{"id":"12-12","t":"领了执照就按期如实申报，没有收入也要报，符合条件才零申报","s":"12","cat":"money","tags":["income","legalentity","tax"]},{"id":"12-13","t":"发票只按真实交易开，小规模纳税人用足免税额","s":"12","cat":"money","tags":["tax"]},{"id":"12-14","t":"自称税务局、打电话或发消息催你往指定账号交钱报税的都是骗子，办税只走电子税务局和 12366","s":"12","cat":"safety","tags":["privacy","scam","save"]},{"id":"12-15","t":"收钱写「定金」不写「订金」，违约金写明数，账期当放贷来审","s":"12","cat":"safety","tags":["contract","law"]},{"id":"12-16","t":"用人第一个月内签书面合同，30 日内办社保登记","s":"12","cat":"safety","tags":["contract","social","income"]},{"id":"12-17","t":"工资按合同和法律给，加薪、借款、奖金都走书面","s":"12","cat":"safety","tags":["contract","income","law"]},{"id":"12-18","t":"先卖再造：用预售和小订单验证有人买，再投钱生产","s":"12","cat":"work","tags":["startup"]},{"id":"12-19","t":"样品做出来先过一遍量产清单，再谈开工","s":"12","cat":"work","tags":["legalentity"]},{"id":"12-20","t":"进货一批留一批票据和上家信息，进货价明显低于市场价的不进：员工替公司进的假货，算公司犯罪时老板也是被判的那个","s":"12","cat":"safety","tags":["crime","legalentity","law"]},{"id":"12-21","t":"商品、包装、吊牌和宣传图上的图案要么自己做要么买授权，改个颜色、加个图标不算「改过了」","s":"12","cat":"work","tags":["legalentity"]},{"id":"12-22","t":"在岗位上按规程办事，规程之外的好意先想清楚责任归谁","s":"12","cat":"work","tags":[]},{"id":"12-23","t":"亏了就按程序退场：能简易注销就注销，资不抵债走破产，别放着不管","s":"12","cat":"work","tags":["startup","legalentity"]},{"id":"12-24","t":"花钱请人代运营网店、上开店培训、做「无货源」之前，先问清后面还要不要加钱、销量从哪来","s":"12","cat":"work","tags":["ecom","startup","scam"]},{"id":"12-25","t":"开公司、当个体户的，每年 1 月 1 日到 6 月 30 日上网报上一年的年报，没生意也要报，年报不收费","s":"12","cat":"work","tags":["legalentity","startup","scam"]},{"id":"12-26","t":"找人凑钱做生意，只找亲友和员工当面谈，不在朋友圈、群里公开招人投钱，也别让亲友替你再去拉人","s":"12","cat":"work","tags":["startup","law","crime"]},{"id":"12-27","t":"租铺面开店，签约前先查这间房能不能开你的店：住宅改成店要同一栋楼的业主全都同意，住宅楼里不能新开有油烟的餐馆","s":"12","cat":"safety","tags":["contract","rent","startup"]},{"id":"12-28","t":"几个人合伙开店，开张前把出资、分钱、谁说了算、谁拿工资、怎么退出写成书面协议","s":"12","cat":"safety","tags":["contract","startup","income"]},{"id":"13-1","t":"有人倒地、叫不应、没正常呼吸，立刻用力按压胸口，让旁人打 120 并找 AED","s":"13","cat":"family","tags":["kids","emergency"]},{"id":"13-2","t":"老人摔倒、有人倒地，先蹲下喊他、打 120，别急着把人扶起来；陌生人这档走开在国内也合法，停下来就别上手搬","s":"13","cat":"safety","tags":["law","elder","emergency"]},{"id":"13-3","t":"突然嘴歪、一侧胳膊没劲、说话说不清，立刻打 120，不要等、不要自己开车去","s":"13","cat":"safety","tags":["traffic","doctor"]},{"id":"13-4","t":"突然天旋地转站不稳、看东西成双、一只眼发黑，或者手指点不到自己鼻尖，也按卒中打 120","s":"13","cat":"health","tags":["doctor"]},{"id":"13-5","t":"一只眼睛突然像拉下窗帘一样黑掉，哪怕几分钟就自己好了，也当天按卒中去急诊","s":"13","cat":"health","tags":["doctor"]},{"id":"13-6","t":"一只眼又胀又痛、发红，看灯有一圈彩虹，还头痛恶心想吐，当天去眼科急诊","s":"13","cat":"health","tags":["doctor"]},{"id":"13-7","t":"胸口压着疼、闷、发紧超过 15 分钟不缓解，或者疼时出冷汗、恶心、喘不上气，打 120，不要自己扛也不要自己开车","s":"13","cat":"safety","tags":["traffic","doctor"]},{"id":"13-8","t":"突然像被撕开一样的剧痛，从胸口往后背、往腰一路挪，打 120 并说清「像撕开一样」","s":"13","cat":"health","tags":["doctor"]},{"id":"13-9","t":"突然一记「这辈子最疼的头痛」，一小时内就到最疼，立刻去急诊做头颅 CT","s":"13","cat":"risk","tags":[]},{"id":"13-10","t":"老人磕过头之后两三周到几个月变得走路不稳、迟钝、嗜睡或者一侧没劲，去做头颅 CT","s":"13","cat":"health","tags":["sport","elder"]},{"id":"13-11","t":"一条腿突然肿起来、发紧、按着疼，尽快就医；再加上突然喘不上气或者胸痛，立刻打 120","s":"13","cat":"health","tags":["doctor"]},{"id":"13-12","t":"大出血先用手死死压住伤口，四肢压不住就上止血带，同时打 120","s":"13","cat":"risk","tags":["emergency"]},{"id":"13-13","t":"被狗、猫咬伤或抓破皮，先用肥皂水和流水交替冲 15 分钟，当天去打疫苗","s":"13","cat":"life","tags":["pet","vaccine"]},{"id":"13-14","t":"烫伤后立刻用凉的流动水冲 20 分钟，别抹牙膏酱油","s":"13","cat":"health","tags":["teeth","kids","doctor"]},{"id":"13-15","t":"突然全身起疹、喘不上气或者发晕，按过敏性休克处理，立刻叫 120 并说清楚","s":"13","cat":"risk","tags":["emergency"]},{"id":"13-16","t":"有人抽搐倒地，清开周围、让他侧躺、看表计时，什么都别往嘴里塞；孩子发烧时抽搐也一样","s":"13","cat":"family","tags":["kids","doctor","emergency"]},{"id":"13-17","t":"糖尿病人突然发抖、出冷汗、说话不清，先给 15 克糖，15 分钟后复测","s":"13","cat":"risk","tags":[]},{"id":"13-18","t":"有人触电，先断电，再用干燥的木棍之类挑开电源，不要直接上手拉","s":"13","cat":"risk","tags":["emergency"]},{"id":"13-19","t":"一氧化碳报警器响了，或者一屋子人同时头痛恶心，先出门再打电话","s":"13","cat":"safety","tags":["fire","law"]},{"id":"13-20","t":"误服清洁剂、农药、药物先别催吐，带上瓶子立刻就医；溅到眼睛或皮肤用大量清水至少冲 15 分钟","s":"13","cat":"health","tags":["medicine","emergency"]},{"id":"13-21","t":"酸碱等化学品溅到身上，立刻脱掉污染的衣服、用大量流动清水冲，眼睛要掰开眼皮冲，冲够时间再走","s":"13","cat":"growth","tags":["time","doctor"]},{"id":"13-22","t":"高温下头晕、恶心、不出汗或意识不清，立刻挪到阴凉处脱衣泼水降温，意识不清的不喂水、打 120","s":"13","cat":"risk","tags":[]},{"id":"13-23","t":"中暑的人只要清醒，就少量多次喝凉的淡盐水或运动饮料，别猛灌、别喝酒和高糖饮料","s":"13","cat":"health","tags":["smoke","diet"]},{"id":"13-24","t":"火灾时贴地爬、摸门再开门、门烫就别开，走楼梯不坐电梯，出去了别回头","s":"13","cat":"safety","tags":["fire"]},{"id":"13-25","t":"看到有人溺水，先叫人和打 110/120，伸竿、抛漂浮物，自己不下水","s":"13","cat":"risk","tags":["emergency","kids"]},{"id":"13-26","t":"有人噎住说不出话，1 岁以上的站到背后做 5 次拍背加 5 次腹部冲击，倒下就做心肺复苏","s":"13","cat":"risk","tags":["emergency","kids"]},{"id":"13-27","t":"在戈壁、沙漠、无人区迷路或车坏了，留在原地或车旁，先报位置，再遮阳保温，省水，不乱走","s":"13","cat":"risk","tags":["disaster"]},{"id":"13-28","t":"发抖、说话含糊、走路打晃是失温，换掉湿衣、包起来，先暖躯干，喝热甜饮不喝酒","s":"13","cat":"health","tags":["sport","smoke","disaster"]},{"id":"13-29","t":"被蛇咬，坐下别动、摘掉戒指手表、尽快送医院打抗蛇毒血清，不切、不吸、不绑死","s":"13","cat":"health","tags":["doctor","emergency"]},{"id":"13-30","t":"地震时先看自己在什么房子里：符合抗震设防的楼里就地躲，会垮的老房子门在几步外就出去","s":"13","cat":"risk","tags":["disaster"]},{"id":"13-31","t":"遇到熊、野猪、成群野狗，别跑，侧身慢慢退开","s":"13","cat":"life","tags":["pet"]},{"id":"13-32","t":"野外遇上雷雨，钻进有硬顶的车或建筑，避开山脊、孤树、水面和金属","s":"13","cat":"risk","tags":[]},{"id":"13-33","t":"上高原按睡眠海拔（当晚睡在多高）慢慢升，症状加重就下撤，不要硬扛","s":"13","cat":"health","tags":["sleep","disaster"]},{"id":"13-34","t":"被蜱虫叮住，用尖头镊子贴着皮肤稳稳拉出来，别涂油别用火烧","s":"13","cat":"risk","tags":[]},{"id":"13-35","t":"野外的水一律烧开再喝，滚开一分钟就够，常见的旅行海拔上不用因为海拔高多煮","s":"13","cat":"risk","tags":[]},{"id":"13-36","t":"荒郊野外被陌生人索财，钱给他，不动手，记特征，脱身后报警","s":"13","cat":"safety","tags":["law","privacy","digital"]},{"id":"13-37","t":"撞见一群人打架，退开走人，别上去拉架、别围观、别捡地上的家伙；要报警就退到安全距离打 110","s":"13","cat":"safety","tags":["law"]},{"id":"13-38","t":"可能被 HIV 暴露了，72 小时内去拿阻断药，越早越好","s":"13","cat":"health","tags":["doctor","medicine"]},{"id":"13-39","t":"救人受了伤、搭进了钱，先找加害人和医保，再去申报见义勇为确认","s":"13","cat":"money","tags":["social","doctor","insurance"]},{"id":"13-40","t":"刀、钢筋、玻璃扎进身体，压住异物周围止血，不要把它拔出来","s":"13","cat":"health","tags":["doctor","emergency"]},{"id":"13-41","t":"怀疑骨折就别再动那个部位，托着不动、冷敷 20 分钟以内，别自己掰正","s":"13","cat":"risk","tags":[]},{"id":"13-42","t":"被性侵之后，先到安全的地方打 110；验伤之前别洗澡、别洗衣服、别收拾房间，72 小时内去医院","s":"13","cat":"health","tags":["doctor","law"]},{"id":"13-43","t":"不满 1 岁的婴儿噎住哭不出声，趴着拍背 5 下、翻过来按胸口 5 下，轮着做，别按肚子","s":"13","cat":"family","tags":["kids","emergency"]},{"id":"13-44","t":"不满 1 岁的婴儿没反应、没正常呼吸，开免提打 120，做婴儿心肺复苏：按 30 下吹 2 口气","s":"13","cat":"family","tags":["kids","emergency"]},{"id":"13-45","t":"孩子吞了纽扣电池，或者吞了两颗以上的强磁珠，立刻去有胃镜的医院急诊，别等它自己拉出来、别催吐","s":"13","cat":"health","tags":["doctor","kids","checkup"]},{"id":"13-46","t":"有人喝醉了，让他侧躺、有人一直守着，别让他一个人睡；叫不醒、呼吸慢或不规律、抽搐、身上发凉就打 120","s":"13","cat":"risk","tags":["emergency","doctor","smoke"]},{"id":"13-47","t":"手指、脚趾被切断，先压住伤口止血，断下来的部分用湿纱布包好装进密封袋，袋子放进冰水里，去有手外科的医院","s":"13","cat":"health","tags":["doctor","emergency"]},{"id":"13-48","t":"恒牙（换牙之后长出来的牙）整颗撞掉，捏住牙冠冲一下，能放回去就放回去，放不回就泡在牛奶里，马上去看牙；乳牙别放回去","s":"13","cat":"health","tags":["teeth"]},{"id":"14-1","t":"邮箱、支付、社交账号都开二次验证，优先用手机弹窗确认，其次才是短信验证码","s":"14","cat":"safety","tags":["privacy","scam","digital"]},{"id":"14-2","t":"邮箱密码单独一个，不和任何网站重复","s":"14","cat":"safety","tags":["privacy"]},{"id":"14-3","t":"手机设锁屏密码，SIM 卡设 PIN 码","s":"14","cat":"safety","tags":["privacy","digital"]},{"id":"14-4","t":"手机丢了按这个顺序做：挂失 SIM 卡、远程锁定、改密码、报警、冻结银行卡","s":"14","cat":"safety","tags":["privacy","digital","law"]},{"id":"14-5","t":"卡被盗刷先挂失冻结再报警，然后要求银行赔：证明「是你自己刷的」是银行的责任","s":"14","cat":"safety","tags":["law","debt","privacy"]},{"id":"14-6","t":"每隔一段时间看一次账号的登录设备和已授权应用，不用的清掉","s":"14","cat":"safety","tags":["privacy","time","digital"]},{"id":"14-7","t":"别为了用 App 点「全部同意」：不是必需的信息，你不同意也不能拒绝给你服务","s":"14","cat":"safety","tags":[]},{"id":"14-8","t":"你有权查看、复制、更正和删除自己的个人信息，被拒绝可以起诉","s":"14","cat":"safety","tags":["law"]},{"id":"14-9","t":"刷脸不是必须答应的：有别的办法就不能只让你刷脸，你不同意得给你其他方式","s":"14","cat":"family","tags":["elder"]},{"id":"14-10","t":"别把代码、密钥和隐私资料交给来路不明的「AI 中转站」，让 AI 自动执行命令时尤其如此","s":"14","cat":"safety","tags":["privacy","save"]},{"id":"14-11","t":"每年查一次自己名下有几张电话卡、几张银行卡，查出不是自己办的就去注销","s":"14","cat":"money","tags":["debt","privacy"]},{"id":"14-12","t":"换手机号、不用旧号之前，先把银行、支付和社交账号改绑到新号上，别让旧号欠费停机了事","s":"14","cat":"safety","tags":["privacy","digital"]},{"id":"15-1","t":"租房时押金的数额、退还时间和扣减情形，必须写进合同","s":"15","cat":"safety","tags":["rent","contract","time"]},{"id":"15-2","t":"被断水断电、换锁、上门威胁赶人，先报警留证：法规禁止用这些方式逼你腾房","s":"15","cat":"safety","tags":["law","rent"]},{"id":"15-3","t":"中介不得代收代付租金和押金，钱直接给房东","s":"15","cat":"safety","tags":["rent"]},{"id":"15-4","t":"租长租公寓先查它的资金监管账户，别图便宜一次性付一年","s":"15","cat":"money","tags":["save","debt","contract"]},{"id":"15-5","t":"房子租期内被卖掉，租约继续有效，不用搬","s":"15","cat":"safety","tags":[]},{"id":"15-6","t":"租房签约前核对产权证和抵押情况，所有款项走转账并备注用途","s":"15","cat":"safety","tags":["contract","scam"]},{"id":"15-7","t":"二手房让中介代收房款的，必须走中介在银行开的交易资金专用存款账户","s":"15","cat":"safety","tags":["rent","contract"]},{"id":"15-8","t":"别租隔断房：最小出租单位是原设计的房间，厨房、卫生间、阳台不得住人","s":"15","cat":"safety","tags":["rent"]},{"id":"15-9","t":"城镇户口想搬去乡下住，只租农房，别买宅基地和宅基地上的房子","s":"15","cat":"safety","tags":["contract","rent"]},{"id":"15-10","t":"买期房时先看预售许可证，定金、首付和贷款只打进合同写明的预售资金监管账户","s":"15","cat":"safety","tags":["contract","debt","legalentity"]},{"id":"15-11","t":"买新房交了认购定金或者首付，没签成正式合同、贷款批不下来（比如签约后政策收紧、银行停贷）又怪不到你的，要求开发商退钱","s":"15","cat":"safety","tags":["contract","debt","law"]},{"id":"15-12","t":"买新房签合同前看清面积误差怎么处理，楼书、广告和沙盘上的承诺拍照留好","s":"15","cat":"safety","tags":["contract","law"]},{"id":"15-13","t":"买新房遇上开发商逾期交房、逾期办证，先发书面催告留证据，再按合同要违约金","s":"15","cat":"safety","tags":["contract","debt","law"]},{"id":"15-14","t":"买房签约前查清有没有查封和抵押，签约后去不动产登记机构办预告登记","s":"15","cat":"safety","tags":["contract","rent"]},{"id":"15-15","t":"背着浮动利率房贷的，利率比新发放的房贷高出一截时，找银行协商降利率或者申请置换","s":"15","cat":"money","tags":["debt"]},{"id":"15-16","t":"买首套房要贷款的，先用住房公积金贷款，额度不够再加商业贷款做组合贷，别直接全做商业贷款","s":"15","cat":"money","tags":["debt","social"]},{"id":"15-17","t":"住小区被物业停水、停电、停暖、停气逼交物业费的，向当地房地产主管部门投诉；自己欠了物业费，物业只能催告、起诉或者申请仲裁","s":"15","cat":"safety","tags":["law","rent"]},{"id":"15-18","t":"买新房收房时当场验房、把问题写进交房记录，漏水和水电管线出毛病，在《住宅质量保证书》的保修期内找开发商修","s":"15","cat":"safety","tags":["rent","home","contract"]},{"id":"16-1","t":"药按医嘱吃满，别感觉好了就停","s":"16","cat":"health","tags":[]},{"id":"16-2","t":"先办门诊慢特病认定再办异地备案，高血压、糖尿病、放化疗、透析、抗排异就能异地直接结算","s":"16","cat":"health","tags":["doctor","checkup","legalentity"]},{"id":"16-3","t":"复查按医生给的间隔做，把每次的指标记在同一个本子上","s":"16","cat":"health","tags":["doctor"]},{"id":"16-4","t":"别为了试偏方、保健品停掉正规治疗","s":"16","cat":"health","tags":["checkup","doctor"]},{"id":"16-5","t":"病情稳定的慢性病，在社区医院一次可以开到 12 周的药","s":"16","cat":"health","tags":["doctor"]},{"id":"16-6","t":"在社区签家庭医生之前，问清楚哪些进医保、哪些自费","s":"16","cat":"money","tags":["social","doctor","relation"]},{"id":"16-7","t":"确诊糖尿病就去查一次眼底，之后按医生给的间隔查；每年查一次脚","s":"16","cat":"health","tags":["doctor"]},{"id":"16-8","t":"得过肾结石就把水喝到每天 2.5–3 升，盐降到 6 克以内","s":"16","cat":"growth","tags":["habit"]},{"id":"16-9","t":"确诊痛风后长了痛风石、影像上看到骨头被啃出缺损或每年发作 2 次以上的，就长期吃降尿酸药，把血尿酸压到 360 µmol/L 以下并一直维持","s":"16","cat":"health","tags":[]},{"id":"16-10","t":"得过痛风的，吃烧烤、聚餐时别一顿吃下大量肉和海鲜，酒也要少喝","s":"16","cat":"health","tags":[]},{"id":"16-11","t":"查出乙肝表面抗原阳性的，每半年做一次肝脏 B 超加甲胎蛋白，按医生评估决定吃不吃抗病毒药，吃上了别自己停","s":"16","cat":"health","tags":["doctor","vaccine"]},{"id":"16-12","t":"确诊慢阻肺的，复诊时让医生或药师看你当面用一遍吸入剂；因为急性加重住过院的，出院后去做肺康复","s":"16","cat":"health","tags":["doctor","vaccine"]},{"id":"16-13","t":"有糖尿病的每年查一次尿白蛋白肌酐比和血肌酐，有高血压的也要查，早点发现慢性肾病","s":"16","cat":"health","tags":["checkup","doctor"]},{"id":"16-14","t":"结肠癌做完手术和化疗的，参加有人指导的运动方案，坚持练满三年","s":"16","cat":"health","tags":["doctor","sport","habit"]},{"id":"17-1","t":"趁老人清醒，书面指定将来的监护人","s":"17","cat":"family","tags":["elder","contract"]},{"id":"17-2","t":"把遗嘱立了，记住后立的推翻先立的，公证遗嘱不再优先","s":"17","cat":"family","tags":["elder","startup"]},{"id":"17-3","t":"老人的钱单独放一个账户，大额支出定一个双人确认的规矩","s":"17","cat":"family","tags":["elder","scam","crime"]},{"id":"17-4","t":"给老人备好一句随时能说出口的推辞：「我要回去和家里人商量」","s":"17","cat":"family","tags":["elder","mind"]},{"id":"17-5","t":"凡是让老人先交钱的「投资养老」都别碰：办卡、买床位、买养老公寓、旅居养老、买老年产品是同一套非法集资","s":"17","cat":"family","tags":["elder","spend","save"]},{"id":"17-6","t":"除了保险公司的住房反向抵押养老保险，其他「以房养老」都别碰，绝不抵押房子去买理财","s":"17","cat":"money","tags":["invest","social","elder"]},{"id":"17-7","t":"家里老人长期卧床或重度失能，去参保地医保部门申请长期护理保险；它不是只发给老人","s":"17","cat":"family","tags":["elder","insurance","social"]},{"id":"17-8","t":"家里有人长期卧床，把压疮当头号敌人：上电动气垫床、定时翻身、每天看一遍骨头突出的地方","s":"17","cat":"health","tags":["doctor"]},{"id":"17-9","t":"老人的白内障已经影响看路，就去眼科评估做手术；两只眼都有的，第二只别拖太久","s":"17","cat":"health","tags":["doctor","elder"]},{"id":"17-10","t":"家里老人遛狗，把牵绳握在手心、别缠在手上，绳子收短，狗先训练到牵着不往前猛冲","s":"17","cat":"life","tags":["pet","doctor","elder"]},{"id":"17-11","t":"送老人住养老院，先查它在民政部门备没备案、签书面协议；押金最多 12 个月床位费，要打进银行专用账户","s":"17","cat":"safety","tags":["contract","elder","rent"]},{"id":"17-12","t":"独生子女的父母住院，查本省条例有没有给子女的护理假，有就带着住院证明向单位书面申请","s":"17","cat":"family","tags":["elder","doctor","contract"]},{"id":"17-13","t":"老人记性越来越差、开始耽误过日子，带去医院的记忆门诊或者神经内科查一次，先排除抑郁、吃的药、听不清看不清这类能改的原因","s":"17","cat":"health","tags":["doctor","elder","mind"]},{"id":"18-1","t":"先把能领的算进来：国家育儿补贴每孩每年 3600 元，发到 3 岁；个税专项附加扣除每孩每月 2000 元","s":"18","cat":"money","tags":["tax","elder","kids"]},{"id":"18-2","t":"产假 98 天，生育津贴由生育保险基金按单位上年度职工月平均工资发；男方的陪产假和夫妻俩的育儿假按本省条例休","s":"18","cat":"money","tags":["insurance","invest","relation"]},{"id":"18-3","t":"知道这条：不得因怀孕、生育、哺乳降工资或者辞退","s":"18","cat":"money","tags":["income","contract","kids"]},{"id":"18-4","t":"养孩子的时间账按「谁的时间被占掉」算，不按「辛不辛苦」算","s":"18","cat":"family","tags":["kids","time"]},{"id":"18-5","t":"钱账分三段算：0 到 3 岁、义务教育、义务教育之后","s":"18","cat":"family","tags":["kids"]},{"id":"18-6","t":"为长辈生、为婚姻生、为养老生，各记一笔账","s":"18","cat":"family","tags":["marriage","elder"]},{"id":"18-7","t":"打算晚几年再生孩子的，先把女方的年龄这笔账算上：40 岁前后自然怀上的几率、试管婴儿的成功率都明显往下走","s":"18","cat":"family","tags":["kids"]},{"id":"19-1","t":"加班费按 1.5 倍、2 倍、3 倍三档算，不给就投诉劳动监察，逾期不付还要加付 50% 到 100%","s":"19","cat":"work","tags":["office","income","law"]},{"id":"19-2","t":"年休假按累计工龄算 5、10、15 天，没休成的按日工资 300% 折钱","s":"19","cat":"money","tags":["income","office","time"]},{"id":"19-3","t":"试用期有法定上限、工资不得低于 80%，而且只能约定一次","s":"19","cat":"money","tags":["income"]},{"id":"19-4","t":"被裁先算清 N：每满一年一个月工资，不满六个月按半个月","s":"19","cat":"money","tags":["income"]},{"id":"19-5","t":"公司以病后干不了、不胜任或情况大变为由辞退你，没提前 30 天通知的，还要多付一个月工资","s":"19","cat":"money","tags":["income","focus","contract"]},{"id":"19-6","t":"公司违法解除的，赔偿金是经济补偿标准的二倍","s":"19","cat":"money","tags":["income","law"]},{"id":"19-7","t":"不要签「个人原因主动辞职」，那一签就没有 N 了","s":"19","cat":"safety","tags":["contract"]},{"id":"19-8","t":"离职前把工资条、考勤、劳动合同、社保记录和聊天记录先存下来","s":"19","cat":"money","tags":["income","contract","office"]},{"id":"19-9","t":"进有粉尘、噪声、化学品的岗位之前，先看合同里写没写危害；三次职业健康检查由单位安排并掏钱","s":"19","cat":"safety","tags":["contract","time"]},{"id":"19-10","t":"粉尘、噪声、化学毒物造成的损伤不少是不可逆的（比如尘肺、噪声聋）：防护用品单位必须给，没有防护措施的作业可以拒绝","s":"19","cat":"family","tags":["kids","contract"]},{"id":"19-11","t":"上班受伤、上下班路上被撞，第一件事是做工伤认定，单位不报你自己报","s":"19","cat":"money","tags":["income","law"]},{"id":"19-12","t":"别信「撑到工位就算工伤」：突发不适先打 120，不是先赶去打卡","s":"19","cat":"money","tags":["income","habit"]},{"id":"19-13","t":"单位没给你交工伤保险，工伤待遇一样有，由单位按同样的标准全额出","s":"19","cat":"money","tags":["insurance","income"]},{"id":"19-14","t":"伤情稳定后去做劳动能力鉴定，伤残等级直接换算成钱","s":"19","cat":"money","tags":["income","contract"]},{"id":"19-15","t":"工亡的三笔钱要分清：丧葬补助金、供养亲属抚恤金、一次性工亡补助金","s":"19","cat":"money","tags":["income"]},{"id":"19-16","t":"在单位长期被欺负、辱骂、刁难，别硬扛：先记下来留证据，再按性质走投诉、报警或者仲裁","s":"19","cat":"safety","tags":["law","contract"]},{"id":"19-17","t":"离职时找单位要一份离职证明，写明合同期限、离职日期、岗位和工作年限","s":"19","cat":"safety","tags":["law","office","contract"]},{"id":"19-18","t":"拿到离职补偿先看个税：当地上年职工平均工资 3 倍以内免税，超出的部分单独算，不并进当年工资","s":"19","cat":"money","tags":["income","tax","office"]},{"id":"19-19","t":"换城市工作时，把养老和医保关系转到新参保地，缴费年限接着累计，别办退保","s":"19","cat":"money","tags":["insurance","social","elder"]},{"id":"19-20","t":"入职满一个月单位还没和你签书面劳动合同，从第二个月起可以要双倍工资，最多 11 个月；满一年还不签，就算签了无固定期限合同","s":"19","cat":"safety","tags":["contract","law","income"]},{"id":"19-21","t":"单位不交或少交社保，先投诉让它补缴；想因此辞职拿经济补偿，辞职通知里要写明是因为单位没依法缴社保","s":"19","cat":"safety","tags":["law","social","focus"]},{"id":"19-22","t":"离职时公司要你赔违约金，先看是哪一种：只有专项培训的服务期和竞业限制能约定违约金，别的名目法律不许约定","s":"19","cat":"safety","tags":["contract","law","office"]},{"id":"19-23","t":"单位要给你调岗、降薪，你不同意就当场书面提出来，别默不作声按新安排干上一个多月","s":"19","cat":"safety","tags":["contract","law","time"]},{"id":"19-24","t":"被劳务派遣到别家公司干活的，工资要和同类岗位的正式工按同一套办法算，在干活的单位受了损害两家公司一起赔","s":"19","cat":"money","tags":["income","law","contract"]},{"id":"20-1","t":"让婴儿期的孩子仰着睡，睡硬的平面，同房不同床，床上不放任何软东西","s":"20","cat":"family","tags":["kids","vaccine"]},{"id":"20-2","t":"出生后 24 小时内打上乙肝疫苗第一针","s":"20","cat":"health","tags":["vaccine","kids"]},{"id":"20-3","t":"按国家免疫规划把该打的疫苗打齐，全程免费，错过了只补没打完的剂次","s":"20","cat":"health","tags":["vaccine","save","kids"]},{"id":"20-4","t":"前 6 个月只喂母乳，连水都不用喂，6 个月起加辅食并继续母乳","s":"20","cat":"family","tags":["kids"]},{"id":"20-5","t":"冲奶粉用 70 ℃ 以上的水，冲好放凉再喂，喝剩的倒掉","s":"20","cat":"family","tags":["kids"]},{"id":"20-6","t":"不满 1 岁不喂蜂蜜","s":"20","cat":"family","tags":["kids"]},{"id":"20-7","t":"出生时的维生素 K 针一定要打","s":"20","cat":"health","tags":["medicine","doctor"]},{"id":"20-8","t":"不满 3 个月的婴儿体温到 38 ℃ 就直接去医院，不在家观察","s":"20","cat":"health","tags":["doctor","kids"]},{"id":"20-9","t":"无论多累多气都不要摇晃婴儿","s":"20","cat":"family","tags":["kids"]},{"id":"20-10","t":"尿布不看牌子看三件事：合不合身、换得勤不勤、有没有被抽检通报过","s":"20","cat":"family","tags":[]},{"id":"20-11","t":"大件按「借、买二手、买新」的顺序考虑，别一次性配齐","s":"20","cat":"family","tags":["kids"]},{"id":"20-12","t":"孩子有严重湿疹或鸡蛋过敏，别躲着花生，按医生指导早点加上，但绝不能喂整粒","s":"20","cat":"family","tags":["kids","emergency","doctor"]},{"id":"20-13","t":"盯住新生儿黄疸的几个信号：出生 24 小时内就黄、叫不醒不吃奶，就当天去医院；越来越黄、大便发白，就尽快去查","s":"20","cat":"health","tags":["doctor","kids"]},{"id":"20-14","t":"怀孕、喂奶时在吃素，就补维生素 B12 或吃强化食品；孩子的辅食要有动物性食物，非要全素先找医生","s":"20","cat":"family","tags":["kids","doctor","medicine"]},{"id":"20-15","t":"给婴儿添置东西时别买带轮子的学步车，想让他坐着玩就换成没轮子的游戏站台或游戏围栏","s":"20","cat":"family","tags":["kids"]},{"id":"20-16","t":"孩子出生后就每天喂 400 国际单位维生素 D，吃母乳的尤其别漏，足月的 6 个月内一般不用另补钙","s":"20","cat":"family","tags":["kids","medicine"]},{"id":"20-17","t":"给婴儿洗澡先放冷水再兑热水，用手腕内侧或手肘试过再放孩子；能设出水温度的热水器调到 50 ℃ 以下","s":"20","cat":"family","tags":["kids","doctor"]},{"id":"21-1","t":"出发前查一次外交部安全提醒，标了「暂勿前往」的地方就别去","s":"21","cat":"safety","tags":["contract"]},{"id":"21-2","t":"把 12308 和当地使领馆的领保电话存进手机，再抄一份放钱包，别等出事再找","s":"21","cat":"life","tags":["digital"]},{"id":"21-3","t":"知道领事保护能做什么、不能做什么：能探视，不能捞人，费用还得自己付","s":"21","cat":"safety","tags":["law"]},{"id":"21-4","t":"买一份含境外医疗和医疗转运的保险，别只买航班延误险","s":"21","cat":"money","tags":["insurance","doctor"]},{"id":"21-5","t":"「境外高薪招聘」一律当诈骗看，被骗去做电诈回来还可能要被限制出境","s":"21","cat":"safety","tags":["scam","crime","job"]},{"id":"21-6","t":"境外取现一年不能超过 10 万元人民币，是本人名下所有卡合起来算的；随身带现金出入境，人民币每次最多 2 万元，外币超过 5000 美元要向海关申报","s":"21","cat":"life","tags":[]},{"id":"21-7","t":"护照、签证、身份证都拍照存一份在云端，丢了先报警再补旅行证","s":"21","cat":"safety","tags":["law","digital"]},{"id":"21-8","t":"境外自驾先确认当地认不认中国驾照，网上卖的「国际驾照」多数是废纸","s":"21","cat":"safety","tags":["contract","insurance"]},{"id":"21-9","t":"找中介办签证、留学、移民，先问它有没有在移民管理机构备案","s":"21","cat":"safety","tags":["rent","school","legalentity"]},{"id":"21-10","t":"别替陌生人出具邀请函，也别让人借你的名义办出入境手续","s":"21","cat":"life","tags":[]},{"id":"21-11","t":"出境前把行程、住处和同行人发给一位家人，约好多久联系一次","s":"21","cat":"family","tags":["relation"]},{"id":"21-12","t":"出国带药先查目的地规定：含伪麻黄碱、可待因的感冒药和止咳药，安眠药、精神类药和强效止痛药，带原包装、处方或医生证明，只带自用量","s":"21","cat":"health","tags":["medicine","doctor","crime"]},{"id":"21-13","t":"从国外回国入境时别带肉制品（真空包装的火腿、肉干也算）、奶酪、新鲜水果和种子，带了动植物产品就走红色通道申报","s":"21","cat":"health","tags":["diet","vaccine","pet"]},{"id":"22-1","t":"进 KTV、酒吧、密室之前先看一眼安全出口在哪，被锁被堵就换一家","s":"22","cat":"life","tags":[]},{"id":"22-2","t":"点单前要价目表，娱乐场所必须明码标价，不接受「先玩后算」","s":"22","cat":"life","tags":[]},{"id":"22-3","t":"场子里有人递「东西」就立刻走，容留和提供都不是「帮朋友」","s":"22","cat":"safety","tags":["crime"]},{"id":"22-4","t":"不吃陌生人给的糖和零食，不喝离开过视线的饮料，不接别人递的烟弹","s":"22","cat":"health","tags":["diet","crime"]},{"id":"22-5","t":"剧本杀、密室别去开在居民楼里或者地下二层以下的","s":"22","cat":"life","tags":[]},{"id":"22-6","t":"心情差到抑郁的程度，就去走或者跑，抗抑郁的效应量（效果大小）跟强度成正比","s":"22","cat":"health","tags":["mind","sport"]},{"id":"22-7","t":"焦虑到影响生活时，正念减压课的效果不劣于常用的抗焦虑药","s":"22","cat":"health","tags":["mind","medicine"]},{"id":"22-8","t":"当场想缓过来，用 5 分钟「循环叹息」：吸气两段，呼气拉长","s":"22","cat":"health","tags":["mind"]},{"id":"22-9","t":"把「定期和人见面」当成健康支出，别只在心情差时才找人","s":"22","cat":"life","tags":[]},{"id":"22-10","t":"选住处时把周边绿地算进去，但别指望「多去公园」就延寿","s":"22","cat":"life","tags":[]},{"id":"22-11","t":"喝了酒别泡温泉、蒸桑拿，回家也别泡热水澡","s":"22","cat":"health","tags":["checkup","smoke"]},{"id":"22-12","t":"滑雪、滑单板、轮滑、骑山地车时戴头盔","s":"22","cat":"safety","tags":["traffic"]},{"id":"23-1","t":"不满 16 周岁没有「去打工」这个选项：招你的单位每月被罚 5000 元，肯招的都是黑工","s":"23","cat":"money","tags":["income","elder"]},{"id":"23-2","t":"把「读书有没有用」也放进死亡率账里：每多受一年教育，成人死亡风险降约 1.9%","s":"23","cat":"growth","tags":["learn"]},{"id":"23-3","t":"判断「学历是不是贬值了」之前，先看全国的学历结构：每 10 万人里只有 15467 人有大学文化程度（2020 年普查，2025 年抽样推算约 19%）","s":"23","cat":"family","tags":["school"]},{"id":"23-4","t":"「读不起」先按政策算一遍：公办中职学费对农村和困难学生大多已免，助学金 2300 元，助学贷款每年最高 2 万","s":"23","cat":"money","tags":["debt","school"]},{"id":"23-5","t":"没考上普高不等于路断了：中职有贯通招生和单独考试，事业单位技能岗位招聘还可以降学历要求","s":"23","cat":"family","tags":["school","job","learn"]},{"id":"23-6","t":"把「读书还是打工」算成一道题：先去打工早挣的三年工资，对上接着读书换来的、往后几十年的年收入差","s":"23","cat":"money","tags":["income","learn","school"]},{"id":"23-7","t":"先记住基准线：多受一年教育 ":"health","tags":["doctor"]},{"id":"24-4","t":"跨省异地就医之前先在本地问一句，必要性原则上要副主任医师以上评估","s":"24","cat":"health","tags":["doctor"]},{"id":"24-5","t":"每次看完病，把病历、检查报告和影像自己存一份","s":"24","cat":"health","tags":["doctor"]},{"id":"24-6","t":"对诊疗有疑问就当场要求封存病历，双方在场、开清单、各执一份","s":"24","cat":"health","tags":["doctor","law"]},{"id":"24-7","t":"急重的伤病直奔急诊预检分诊台，别去挂号窗口排队","s":"24","cat":"health","tags":["doctor","time"]},{"id":"24-8","t":"没带钱、没带证件、说不清自己是谁，急诊也必须先救","s":"24","cat":"health","tags":["doctor"]},{"id":"24-9","t":"伤残鉴定要等治疗终结或者临床治疗效果稳定之后再做","s":"24","cat":"health","tags":["doctor","income"]},{"id":"24-10","t":"治完之后确实留下功能障碍，去户籍地县级残联申请残疾人证","s":"24","cat":"money","tags":["save"]},{"id":"24-11","t":"谢救过你的医生，走感谢信、锦旗和满意度评价，别走红包：准则禁的是财物，不是谢意","s":"24","cat":"health","tags":["doctor","time"]},{"id":"24-12","t":"种牙之前先问清包干价含哪些项目，优先找承诺参与价格治理的机构，别信低价广告","s":"24","cat":"health","tags":["teeth","doctor"]},{"id":"24-13","t":"医院说国家医保谈判药没货、不进院的，让医生开处方，去医保「双通道」定点药店买，照样按规定报销","s":"24","cat":"health","tags":["doctor","social"]},{"id":"24-14","t":"在医院确诊过、病情稳定的慢性病要续方，可以在这家医院的互联网医院线上复诊开药，第一次看这个病不能在网上看","s":"24","cat":"health","tags":["doctor"]},{"id":"24-15","t":"住院时要来费用清单逐项对，医保不报的自费项目先问清再同意，对不上先找医院价格投诉，再不行向医保部门举报","s":"24","cat":"health","tags":["doctor","law","social"]},{"id":"25-1","t":"人在家里或外面没了，先分清正常死亡还是非正常死亡：意外、死因不明、独居才发现的，立刻报警，遗体和现场不要动","s":"25","cat":"safety","tags":["law"]},{"id":"25-2","t":"死亡证明是后面所有事的钥匙：谁救治谁开，家中正常死亡找社区卫生服务机构，一日内签发","s":"25","cat":"money","tags":["social"]},{"id":"25-3","t":"遗体接运、存放、火化只能走殡仪馆，医院太平间不办殡仪，存放一般不超过 3 日","s":"25","cat":"health","tags":["doctor"]},{"id":"25-4","t":"对死因有异议，48 小时内提出并进行尸检，同时封存病历","s":"25","cat":"health","tags":["doctor"]},{"id":"25-5","t":"给去世的人注销户口有法定时限：城市在安葬前，农村在一个月以内","s":"25","cat":"money","tags":["social"]},{"id":"25-6","t":"殡葬服务分基础项目和非基础项目，基础项目有清单、收费依法制定","s":"25","cat":"family","tags":[]},{"id":"25-7","t":"遇到强制搭售、标价外加价、把一项拆成几项收费，记下来投诉","s":"25","cat":"safety","tags":["law"]},{"id":"25-8","t":"殡葬代理、用品代购、策划主持这类中介，要在县级民政备案","s":"25","cat":"safety","       ORB.phi += (flyTo.phi - ORB.phi) * e2 * 0.12;

    }
    if (hoverCat){
      for (var hc = 0; hc < catObjs.length; hc++){
        var co = catObjs[hc];

    }
    if (ORB.auto && !drag) ORB.theta += 0.00042;
    var sp = Math.sin(ORB.phi), cp = Math.cos(ORB.phi);
    camera.position.set(ORB.r * sp * Math.sin(ORB.theta), ORB.r * cp, ORB.r * sp * Math.cos(ORB.theta));
    camera.lookAt(0, 0, 0);
    for (var i = 0; i < groups.length; i++){
      var g = groups[i];
      g.rotation.y = sec * g.userData.spin + g.userData.phase;
      g.position.y = Math.sin(sec * .5 + g.userData.phase) * 12;
    }
    if (catObjs.length){
      for (var k = 0; k < catObjs.length; k++){
        var m = catObjs[k], s = 1 + Math.sin(sec * .9 + k) * .04;
        if (THEMES[themeKey].fancy) m.rotation.y = sec * .12 + k;
        m.scale.setScalar(m.userData.baseR ? m.userData.baseR * s : m.scale.x);
      }

    for (var h = 0; h < halos.length; h++){ halos[h].rotation.z += 0.004 + h * 0.0004; }
    for (var q = 0; q < tagAnims.length; q++){
      var tb = tagAnims[q];
      tb.position.y = tb.userData.base.y + Math.sin(sec * 1.1 + tb.userData.ph) * 4;
      tb.rotation.y = sec * .25 + tb.userData.ph;
    }
    for (var mo = 0; mo < meteors.length; mo++){
      var M = meteors[mo];
      if (M.wait > 0){
        M.wait -= 0.016;
        M.sp.material.opacity = 0; M.line.material.opacity = 0;
        continue;
      }
      M.t += 0.016;
      if (M.t > 3.2){
        M.t = 0; M.wait = 1.5 + Math.random() * 5; M.started = false;
        M.x = rnd(2400); M.y = 600 + rnd(500); M.z = rnd(1800) - 900;
        M.vx = -900 - Math.random() * 700; M.vy = -320 - Math.random() * 220;
        continue;
      }
      M.x += M.vx * 0.016; M.y += M.vy * 0.016;
      M.sp.position.set(M.x, M.y, M.z);
      if (!M.started){
        M.started = true;
        for (var q5 = 0; q5 < M.n; q5++){ M.arr[q5 * 3] = M.x; M.arr[q5 * 3 + 1] = M.y; M.arr[q5 * 3 + 2] = M.z; }
      }
      for (var q6 = M.n - 1; q6 > 0; q6--){
        M.arr[q6 * 3] = M.arr[(q6 - 1) * 3];
        M.arr[q6 * 3 + 1] = M.arr[(q6 - 1) * 3 + 1];
        M.arr[q6 * 3 + 2] = M.arr[(q6 - 1) * 3 + 2];

      M.arr[0] = M.x; M.arr[1] = M.y; M.arr[2] = M.z;

      M.line.material.opacity = fade3 * .55;
      M.sp.scale.setScalar(26 + fade3 * 22);
    }
    if (sunMesh){
      sunMesh.material.uniforms.uTime.value = sec;
      sunMesh.rotation.y = sec * .05;
      if (sunCorona){ sunCorona.material.uniforms.uTime.value = sec; sunCorona.rotation.y = -sec * .02; }
      for (var hs = 0; hs < sunHalos.length; hs++){
        sunHalos[hs].scale.setScalar((hs ? 980 : 560) * (1 + Math.sin(sec * 1.1 + hs) * .04));
      }
      for (var ff = 0; ff < sunFlares.length; ff++){
        var F = sunFlares[ff];
        var k2 = (Math.sin(sec * F.spd + F.ph) * .5 + .5);
        F.sp.position.copy(F.dir).multiplyScalar(94 + k2 * 26);
        F.sp.scale.setScalar(46 + k2 * 96);
        F.sp.material.opacity = .10 + k2 * .55;
      }
      for (var pp = 0; pp < prominences.length; pp++){
        var pr2 = prominences[pp];
        pr2.material.opacity = .55 + Math.sin(sec * 1.6 + pp * 2.1) * .3;
        pr2.rotation.z += .0006 + pp * .0002;
      }
    }
    adaptQuality(0.016);
    if (fpsAcc > .5){
      var fEl = document.getElementById('fps');
      if (fEl && fEl.style.display !== 'none'){
        fEl.textContent = 'FPS ' + Math.round(fpsN / fpsAcc) + ' · 图元 ' + renderer.info.render.triangles;
        fpsAcc = 0; fpsN = 0;
      }
    }
    if (domeMesh) domeMesh.rotation.y = sec * 0.0045;
    if (starField) starField.material.uniforms.uTime.value = sec;
    if (spiralNeb){
      spiralNeb.material.rotation += 0.00035;
      spiralNeb.material.opacity = .55 + Math.sin(sec * .6) * .08;
    }
    if (blackHole){
      var BH = blackHole;
      // 塌陷闪光
      BH.nextFlare -= dt;
      if (BH.nextFlare <= 0 && BH.flare <= 0){ BH.flare = 2.4; BH.nextFlare = 18 + Math.random() * 20; }
      if (BH.flare > 0) BH.flare -= dt;
      var fk = BH.flare > 0 ? Math.sin(Math.min(1, (2.4 - BH.flare) / 2.4) * Math.PI) : 0;
      BH.disk.material.opacity = .95 + fk * .05;
      BH.disk.scale.setScalar(1 + fk * .22);
      BH.glow.scale.setScalar(680 * (1 + fk * .5));
      BH.photon.material.opacity = .95 + fk * .05;
      if (BH.parts){
        var pd = BH.parts.dat, pa = BH.parts.arr;
        for (var kp = 0; kp < pd.length; kp++){
          var P3 = pd[kp];
          P3.r -= P3.s * dt;
          P3.a += (P3.w * 26 / Math.max(60, P3.r)) * dt;
          if (P3.r < 95){ P3.r = 120 + Math.random() * 320; P3.a = Math.random() * 6.2832; }
          pa[kp * 3] = Math.cos(P3.a) * P3.r;
          pa[kp * 3 + 1] = Math.sin(P3.a) * P3.r * .16;
          pa[kp * 3 + 2] = Math.sin(P3.a) * P3.r;
        }
        BH.parts.geo.attributes.position.needsUpdate = true;
        BH.parts.pts.material.opacity = .55 + fk * .35;
      }
      blackHole.disk.rotation.z += 0.0022;
      blackHole.photon.rotation.z -= 0.002;
      blackHole.glow.material.opacity = .45 + Math.sin(sec * 1.3) * .12;
    }
    if (typeof lastSec === 'undefined') lastSec = sec;
    var dt = Math.min(.05, Math.max(.001, sec - lastSec)); lastSec = sec;

    for (var ww = 0; ww < wanderers.length; ww++){
      var W = wanderers[ww];
      W.mesh.position.addScaledVector(W.vel, dt);
      W.mesh.rotation.y += W.spin;
      if (W.mesh.position.length() > 2600){
        W.vel.multiplyScalar(-1);
      }
    }
    for (var so = 0; so < solarOrbits.length; so++){
      var O = solarOrbits[so];
      O.a = O.baseA + sec * O.w + Math.sin(sec * .13 + O.ph) * .05;
      O.mesh.position.set(Math.cos(O.a) * O.r, O.y, Math.sin(O.a) * O.r);
      O.mesh.rotation.y += 0.004;
      O.group.position.copy(O.mesh.position);
      if (O.mesh.userData.satRing) O.mesh.userData.satRing.position.copy(O.mesh.position);
    }
    for (var pr3 = 0; pr3 < planetRings.length; pr3++){
      var RR = planetRings[pr3];
      if (RR.userData.follow) RR.position.copy(RR.userData.follow.position);
      RR.rotation.z += .0015;
    }
    for (var ee = 0; ee < eruptions.length; ee++){
      var E = eruptions[ee];
      if (!E.mesh.visible){
        E.wait -= dt;
        if (E.wait <= 0){
          E.mesh.visible = true; E.t = 0;
          E.mesh.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);
        }
      } else {
        E.t += dt;
        var pp2 = E.t / E.dur;
        E.mesh.material.opacity = Math.sin(Math.min(1, pp2) * Math.PI) * .95;
        E.mesh.scale.setScalar(100 + pp2 * 26);
        if (pp2 >= 1){ E.mesh.visible = false; E.wait = 8 + Math.random() * 16; }
      }
    }

    if (fireball){
      var F2 = fireball;
      if (!F2.active){
        F2.wait -= dt;
        if (F2.wait <= 0){
          F2.active = true; F2.t = 0; F2.started = false;
          F2.sp.material.opacity = 1;
        }
      } else {
        F2.t += dt;
        if (!F2.started){
          F2.started = true;
          var st = new THREE.Vector3(rnd(1600), 400 + Math.random() * 500, rnd(1400) - 600);
          F2.sp.position.copy(st);
          F2.vel.set(-260 - Math.random() * 180, -180 - Math.random() * 120, rnd(120)).normalize().multiplyScalar(900 + Math.random() * 500);
          for (var q3 = 0; q3 < F2.n; q3++){ F2.arr[q3 * 3] = st.x; F2.arr[q3 * 3 + 1] = st.y; F2.arr[q3 * 3 + 2] = st.z; }
        }
        F2.sp.position.addScaledVector(F2.vel, dt);
        for (var q4 = F2.n - 1; q4 > 0; q4--){
          F2.arr[q4 * 3] = F2.arr[(q4 - 1) * 3];
          F2.arr[q4 * 3 + 1] = F2.arr[(q4 - 1) * 3 + 1];
          F2.arr[q4 * 3 + 2] = F2.arr[(q4 - 1) * 3 + 2];
        }
        F2.arr[0] = F2.sp.position.x; F2.arr[1] = F2.sp.position.y; F2.arr[2] = F2.sp.position.z;
        F2.geo.attributes.position.needsUpdate = true;
        var fade2 = Math.sin(Math.min(1, F2.t / F2.dur) * Math.PI);
        F2.sp.material.opacity = fade2;
        F2.line.material.opacity = fade2 * .55;
        F2.sp.scale.setScalar(70 + fade2 * 60);
        if (F2.t >= F2.dur){ F2.active = false; F2.wait = 12 + Math.random() * 18; F2.sp.material.opacity = 0; F2.line.material.opacity = 0; }
      }
    }

    for (var tr = 0; tr < trails.length; tr++){
      var T0 = trails[tr], a0 = T0.arr, nn = T0.n;
      for (var q2 = nn - 1; q2 > 0; q2--){
        a0[q2 * 3] = a0[(q2 - 1) * 3];
        a0[q2 * 3 + 1] = a0[(q2 - 1) * 3 + 1];
        a0[q2 * 3 + 2] = a0[(q2 - 1) * 3 + 2];
      }
      a0[0] = T0.mesh.position.x; a0[1] = T0.mesh.position.y; a0[2] = T0.mesh.position.z;
      T0.geo.attributes.position.needsUpdate = true;
    }
    for (var mr = 0; mr < maxRings.length; mr++){
      maxRings[mr].rotation.z += 0.0025 + mr * 0.0012;
      maxRings[mr].rotation.x += 0.0008;
    }
    if (maxCore){
      var ck = 1 + Math.sin(sec * 1.6) * .08;
      maxCore.scale.setScalar(620 * ck);
      maxCore.material.opacity = .45 + Math.sin(sec * 1.6) * .12;
      ORB.r = 1750 + Math.sin(sec * .35) * 90;
    }
    for (var pu = 0; pu < pulses.length; pu++){
      var P0 = pulses[pu];
      P0.t += P0.speed * 0.016;
      if (P0.t > 1) P0.t = 0;
      P0.curve.getPoint(P0.t, P0.sp.position);
      var sc0 = 18 + Math.sin(P0.t * Math.PI) * 16;
      P0.sp.scale.setScalar(sc0);
    }
    placeLabels();
    if (raysPass && sunMesh){
      var sv = new THREE.Vector3(0, 0, 0).project(camera);
      var on = sv.z < 1 && Math.abs(sv.x) < 1.6 && Math.abs(sv.y) < 1.6;
      raysPass.uniforms.uSun.value.set(sv.x * .5 + .5, sv.y * .5 + .5);
      raysPass.uniforms.uIntensity.value = on ? .62 : 0;
    }
    if (gradePass){
      gradePass.uniforms.uTime.value = sec;
      gradePass.uniforms.uRes.value.set(innerWidth, innerHeight);
    }
    updateFlare();
    if (composer) composer.render(); else renderer.render(scene, camera);
  }

  // ---- 交互 ----
  var el;
  function bind(){
    el = renderer.domElement;
    el.addEventListener('pointerdown', function(e){ drag = true; ORB.auto = false; lx = e.clientX; ly = e.clientY; el.setPointerCapture(e.pointerId); });
    el.addEventListener('pointerup', function(e){ drag = false; try { el.releasePointerCapture(e.pointerId); } catch(x){} });
    el.addEventListener('pointermove', function(e){
      pointer.x = (e.clientX / innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / innerHeight) * 2 + 1;
      if (drag){
        ORB.theta -= (e.clientX - lx) * .005;
        ORB.phi = Math.max(.25, Math.min(Math.PI - .25, ORB.phi - (e.clientY - ly) * .0045));
        lx = e.clientX; ly = e.clientY;
        tip.style.opacity = 0;
      } else hover(e);
    });
    el.addEventListener('wheel', function(e){ e.preventDefault();
      ORB.r = Math.max(520, Math.min(3200, ORB.r * (1 + Math.sign(e.deltaY) * .08))); }, { passive: false });
    el.addEventListener('click', function(e){ pick(e, true); });
    addEventListener('resize', function(){ camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); if (composer) composer.setSize(innerWidth, innerHeight); if (bloomPass) bloomPass.resolution.set(innerWidth, innerHeight); });
  }

  function hit(e){
    raycaster.setFromCamera(new THREE.Vector2((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1), camera);
    var objs = raycaster.intersectObjects(catObjs.concat(tagObjs), false)[0];
    return objs ? objs.object.userData : null;
  }
  function hover(e){
    var h = hit(e);
    if (h){
      tip.textContent = h.kind === 'cat' ? (h.node.name + ' · ' + h.node.count + ' 条') : (h.node.name + ' · ' + h.node.count + ' 条');
      tip.style.left = (e.clientX + 14) + 'px'; tip.style.top = (e.clientY + 16) + 'px'; tip.style.opacity = 1;
      el.style.cursor = 'pointer';
    } else { tip.style.opacity = 0; el.style.cursor = drag ? 'grabbing' : 'grab'; }
  }
  function pick(e, show){
    var h = hit(e); if (!h || !show) return;
    var panel = document.getElementById('panel');
    if (h.kind === 'cat'){
      document.getElementById('pt').textContent = h.node.name;
      document.getElementById('pc').textContent = h.node.count + ' 条 · 这一大类';
      var ids = [];
      h.node.tags.forEach(function(tid){ (byTag[tid].items || []).forEach(function(id){ if (ids.indexOf(id) < 0) ids.push(id); }); });
      fill(ids);
    } else {
      document.getElementById('pt').textContent = h.node.name;
      document.getElementById('pc').textContent = h.node.count + ' 条 · 标签';
      fill(h.node.items || []);
    }
    panel.style.display = 'block';
  }
  function fill(ids){
    var ol = document.getElementById('pl');
    ol.innerHTML = ids.slice(0, 60).map(function(id){
      var it = items[id]; if (!it) return '';
      return '<li data-img="assets/卡片-' + id + '-无标签-v3.webp"><a href="index.html#e-' + id + '">' + String(it.t).replace(/</g, '&lt;') + '</a></li>';
    }).join('') + (ids.length > 60 ? '<li style="opacity:.6">……还有 ' + (ids.length - 60) + ' 条</li>' : '');
  }
  document.getElementById('px').onclick = function(){ document.getElementById('panel').style.display = 'none'; };

  // 双击行星 → 镜头飞过去
  var flyTo = null;
  host.addEventListener('dblclick', function(e){
    var r = host.getBoundingClientRect();
    pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
    pointer.y = -((e.clientY - r.top) / r.height) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    var hit = raycaster.intersectObjects(catObjs, false)[0];
    if (!hit) return;
    var p = hit.object.position;
    var rr = Math.sqrt(p.x * p.x + p.z * p.z);
    flyTo = { theta: Math.atan2(p.x, p.z), phi: Math.max(.5, Math.min(1.5, 1.05)),
      r: Math.max(420, rr + 260), t: 0 };
    ORB.auto = false;
  });
  addEventListener('keydown', function(e){
    if (e.key === 'Escape' || e.key === 'r' || e.key === 'R'){
      flyTo = { theta: ORB.theta, phi: 1.16, r: 1750, t: 0 };
      ORB.auto = true;
    }
  });

  (function(){
    var fb = document.getElementById('fs-btn'), fx = document.getElementById('fs-exit');
    if (!fb || !fx) return;
    function on(){ document.documentElement.classList.add('fs-mode'); }
    function off(){ document.documentElement.classList.remove('fs-mode'); }
    function enter(){
      var el = document.documentElement;
      var req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
      if (req){
        try {
          var pr = req.call(el);
          if (pr && pr.then) { pr.then(on).catch(function(){ document.documentElement.classList.add('pseudo-fs'); on(); }); }
          else { on(); }
        } catch(e){ document.documentElement.classList.add('pseudo-fs'); on(); }
      } else {
        document.documentElement.classList.add('pseudo-fs'); on();
      }
    }
    function exit(){
      if (document.exitFullscreen) { document.exitFullscreen().catch(function(){}); }
      else if (document.webkitExitFullscreen) { document.webkitExitFullscreen(); }
      document.documentElement.classList.remove('pseudo-fs');
      off();
    }
    fb.onclick = enter;
    fx.onclick = exit;
    document.addEventListener('fullscreenchange', function(){
      if (document.fullscreenElement) on(); else off();
    });
    addEventListener('keydown', function(e){
      if (e.key === 'f' || e.key === 'F'){ if (!document.documentElement.classList.contains('fs-mode')) enter(); }
      if (e.key === 'Escape') exit();
    });
  })();

  // 「!」说明面板
  (function(){
    var btn = document.getElementById('info-btn'), panel = document.getElementById('info-panel');
    if (!btn || !panel) return;
    btn.onclick = function(e){ e.stopPropagation(); panel.classList.toggle('on'); };
    var close = document.getElementById('ip-close');
    if (close) close.onclick = function(){ panel.classList.remove('on'); };
    var ib = document.getElementById('ip-bloom');
    if (ib) ib.onclick = function(){
      if (!bloomPass) return;
      bloomPass.enabled = !bloomPass.enabled;
      ib.textContent = '辉光：' + (bloomPass.enabled ? '开' : '关');
    };
  })();

  // H 隐藏文字 / F 帧率 / 空格暂停
  (function(){
    var hidden = false;
    addEventListener('keydown', function(e){
      if (e.key === 'h' || e.key === 'H'){
        hidden = !hidden;
        document.documentElement.classList.toggle('no-labels', hidden);
      }
      if (e.key === 'f' || e.key === 'F'){
        var fp = document.getElementById('fps');
        if (fp) fp.style.display = fp.style.display === 'none' ? 'block' : 'none';
      }
      if (e.code === 'Space'){
        e.preventDefault();
        ORB.auto = !ORB.auto;
      }
    });
  })();

  (function(){
    var bt = document.getElementById('bloom-toggle'); if (!bt) return;
    bt.onclick = function(){
      if (!bloomPass) return;
      bloomPass.enabled = !bloomPass.enabled;
      bt.textContent = '辉光：' + (bloomPass.enabled ? '开' : '关');
    };
  })();

  // 面板里悬停某一条 → 直接弹那张卡片大图
  (function(){
    var pv = document.getElementById('imgprev'); if (!pv) return;
    var pvImg = pv.querySelector('img'), pl = document.getElementById('pl');
    function place(x, y){
      var w = pv.offsetWidth, h = pv.offsetHeight;
      var lx = x - w - 22, ly = y - h / 2;
      if (lx < 10) lx = x + 24;
      if (ly < 66) ly = 66;
      if (ly + h > innerHeight - 12) ly = innerHeight - h - 12;
      pv.style.transform = 'translate(' + lx + 'px,' + ly + 'px)';
    }
    pl.addEventListener('mouseover', function(e){
      var li = e.target.closest('li'); if (!li || !li.dataset.img) return;
      pvImg.src = encodeURI(li.dataset.img);
      pv.classList.add('on');
      place(e.clientX, e.clientY);
    });
    pl.addEventListener('mousemove', function(e){
      if (!pv.classList.contains('on')) return;
      place(e.clientX, e.clientY);
    });
    pl.addEventListener('mouseout', function(e){
      if (e.target.closest('li')) pv.classList.remove('on');
    });
    pl.addEventListener('scroll', function(){ pv.classList.remove('on'); });
  })();

  // ---- 风格按钮 ----
  var box = document.getElementById('themes');
  Object.keys(THEMES).forEach(function(k){
    var T = THEMES[k];
    var b = document.createElement('button');
    b.className = 'sw'; b.title = T.name; b.setAttribute('aria-label', T.name);
    b.style.background = T.bg;
    b.setAttribute('aria-pressed', String(k === themeKey));
    b.innerHTML = '<span>' + T.name + '</span>';
    b.onclick = function(){
      themeKey = k;
      try { localStorage.setItem('hltb-nebula-theme', k); } catch(e){}
      [].forEach.call(box.children, function(x){ x.setAttribute('aria-pressed', String(x === b)); });
      tagObjs = []; catObjs = []; groups = []; halos = []; tagAnims = []; pulses = []; maxRings = []; maxCore = null; solarOrbits = []; blackHole = null; meteors = []; spiralNeb = null; saturns = []; planetRings = [], eruptions = [], fireball = null; sunMesh = null; sunCorona = null; prominences = []; sunHalos = [], sunFlares = [], wanderers = [], ship = null, shipFlames = [], lastSec = 0; trails = [];
      build(); bind();
    };
    box.appendChild(b);
  });

  build();
  bind();
  requestAnimationFrame(tick);
})();
</script>
</body>
